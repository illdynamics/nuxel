# Nuxel S10+ phoc configuration (beyond2lte).
#
# This is /usr/share/phosh/phoc.ini for the phone, with the HEADLESS-1 output
# geometry set to the handset's own panel: 1440x3040 at scale 2 => 720x1520
# logical pixels => a 360 CSS-pixel viewport, the same band the UTM VM renders
# the Nuxel launcher in (VM: [output:Virtual-1] mode = 720x1440, scale = 2,
# 360 CSS px).  The VM value is kept for reference below; only the physical
# resolution differs, which the port record documents.
[output:HEADLESS-1]
mode = 720x1520
scale = 2
