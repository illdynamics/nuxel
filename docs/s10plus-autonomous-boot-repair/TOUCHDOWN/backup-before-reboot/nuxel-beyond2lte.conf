# Nuxel device configuration — Samsung Galaxy S10+ (beyond2lte)
# Corrected 2026-10-11: WiFi is Samsung bcmdhd (not brcmfmac).

NUXEL_DEVICE=s10plus
NUXEL_CODENAME=beyond2lte
NUXEL_UFS_PATH=/dev/block/platform/13d60000.ufs/by-name
NUXEL_DISPLAY_RESOLUTION=3040x1440
NUXEL_DISPLAY_DDIC=S6E3HA9

# WiFi firmware (Samsung bcmdhd driver) — chip rev B1
NUXEL_WIFI_FW_PATH=/lib/firmware/bcmdhd_sta.bin_b1
NUXEL_WIFI_FW_MFG=/lib/firmware/bcmdhd_mfg.bin_b1
NUXEL_WIFI_FW_MON=/lib/firmware/bcmdhd_mon.bin_b1
NUXEL_WIFI_CLM_BLOB=/lib/firmware/bcmdhd_clm.blob
# NVRAM is chosen by the board's chip rev; B1 semco example:
NUXEL_WIFI_NVRAM=/lib/firmware/nvram.txt_CS01_semco_b1
NUXEL_BT_HCD_PATH=/lib/firmware/bcm4375B1_semco.hcd

# Touch firmware is embedded in the downstream sec_ts driver.
NUXEL_TOUCH_FW_PATH=embedded-in-sec_ts

# Kernel: downstream Samsung Exynos 9820 fork (Linux 4.14.253)
NUXEL_KERNEL=linux-samsung-beyond2lte
