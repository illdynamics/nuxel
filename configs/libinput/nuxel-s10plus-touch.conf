# Nuxel touch configuration for the Samsung Galaxy S10+ (beyond2lte, SM-G975F)
#
# Device truth (measured, not assumed):
#   controller  Samsung S6SY761 "sec_ts", built into the vendor 4.14.253 kernel
#   i2c client  4-0048 on hsi2c-4  -> /sys/bus/i2c/devices/4-0048
#   input name  "sec_touchscreen"  (PROP=2 -> INPUT_PROP_DIRECT, ABS_MT present)
#   framebuffer 1440x3040 native portrait (DECON fbdev, ABGR8888)
#
# WHY THIS FILE EXISTS
# --------------------
# `configs/libinput/` used to be a symlink to
# `configs/google-pixel-10-pro-xl/libinput/`, which would have installed a Pixel
# ("nuxel-mustang") touch InputClass on this phone.  Third-party hardware
# configuration that does not match this device must not be applied to it, so the
# symlink is replaced by this real directory and this file carries the S10+ values.
# The Pixel config stays where it belongs, at
# configs/google-pixel-10-pro-xl/libinput/nuxel-mustang-touch.conf.
#
# WHAT IS DELIBERATELY ABSENT
# ---------------------------
# * NO CalibrationMatrix and NO TransformationMatrix are set: the panel and the
#   framebuffer share orientation and the touch controller reports in the panel
#   frame (measured: ABS_MT_POSITION_X 0..1439, ABS_MT_POSITION_Y 0..3039), so the
#   identity is correct and no invented calibration numbers are shipped.  Values
#   must come from a real `libinput debug-events` / raw evdev capture on the phone.
# * NO MatchDevicePath with a fixed node number.  This is libinput .conf syntax
#   (device matching by udev properties and capability), not an X11 InputClass, and
#   matching is by NAME + CAPABILITY so a node renumbering cannot select the wrong
#   device - the same rule the A33 shim and tracer follow.
#
# Installed to: /etc/libinput/local-overrides/99-nuxel-s10plus-touch.conf
# (upstream libinput reads conf.d snippets there; the X11 form of the touch
#  calibration, if the device ever runs X, is configs/s10plus/libinput/.)

[sec_touchscreen]
# Match by the kernel's own device name, never by a node number.
MatchName=sec_touchscreen

# The panel is a direct multitouch surface; libinput must treat it as a touchscreen.
MatchIsTouchscreen=yes

# Handedness / palm rejection: leave libinput's defaults.  The vendor driver already
# gates on wet/grip state (measured telemetry: "wet:0 wc:0 ... Cal_flag:Success"),
# and no measured reason exists to override it.  Any override here would be a guess.

# Disable "disable-while-typing": there is no integrated keyboard on this device.
DisableWhileTyping=0

# Tap/drag defaults are fine (libinput defaults, no measurement contradicts them).
# Explicit identity transform, so the intent is reviewable rather than implicit -
# but only because it was verified: raw ABS_MT coordinates inside the reported
# device range map 1:1 onto the 1440x3040 panel.
TransformationMatrix=1 0 0 0 1 0 0 0 1

# NOTE on calibration: NOT shipped - see "WHAT IS DELIBERATELY ABSENT" above.
