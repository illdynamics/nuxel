#==============================================================================
# Nuxel hardened_malloc configuration (GrapheneOS allocator)
#
# Applied system-wide via configs/hardened-malloc.service.d/00-nuxel.conf
# which sets LD_PRELOAD=/usr/lib/libhardened_malloc.so per-app.
#
# DOCUMENTATION-ONLY FILE
# -----------------------
# The `[allocator]` section below is a human-readable specification of the
# desired hardened_malloc behavior. It is NOT consumed at runtime by any
# helper in this repo today. The AUTHORITATIVE runtime settings are the
# HARDENED_MALLOC_* environment variables in
# configs/hardened-malloc.service.d/00-nuxel.conf (which are set from the same
# single source documented here to avoid drift):
#
#   abort_on_error              -> HARDENED_MALLOC_ABORT_ON_ERROR=1
#   transparent_hugepage=never  -> HARDENED_MALLOC_TRANSPARENT_HUGEPAGE=never
#   drop_guards                 -> HARDENED_MALLOC_DROP_GUARDS=1
#   tcache_shutdown_threshold   -> HARDENED_MALLOC_TCACHE_SHUTDOWN_THRESHOLD
#
# If a runtime translator is later wired up (e.g. shell/nuxel-security), it
# MUST read this file and produce the same HARDENED_MALLOC_* env values shown
# above; until then keep the two in sync by hand.
#==============================================================================

[allocator]
abort_on_error = 1

# Transparent huge pages must be disabled for the allocator's guard/random
# slab mappings to work reliably (THP would merge/map the guard regions).
transparent_hugepage = never

# Drop guard pages at unmapped-ish slab boundaries to harden the quarantine.
# 1 = eagerly unmap guard/empty slabs, 0 = keep them mapped.
drop_guards = 1

# When the tcache reaches this many bytes it is shut down and its contents are
# released back to the quarantine/OS, bounding the tcache's allocator-speed
# attacks. Lower = smaller to-be-exploited cache footprint but more syscalls.
tcache_shutdown_threshold = 16777216

# --- GrapheneOS-hardened allocator tunables (kept from prior scaffold) ---

# Zero freed memory immediately to prevent info leaks.
zero_on_free = true

# Random canary value placed after heap allocations; detects overflow on free.
canary = true
canary_size = auto

# Guard slabs: unmapped pages between slab allocations; catches linear
# overflows immediately with SIGSEGV.
guard_slabs = true

# Quarantine: freed chunks held before reuse; prevents immediate use-after-free.
quarantine = true
quarantine_size = 16

# Large allocations (> 16 KB) use mmap directly with guard pages.
large_config = true

# On OOM abort with a clear signal instead of undefined behavior.
handle_oom = abort

# Fill free chunks with a pattern to detect use-after-free.
free_fill_byte = 0x66

# Minimum alignment for allocations.
minimum_alignment = 16

# Randomize slab slot selection (not sequential).
random_slab_selection = true

# Write-protect slab metadata when not in use.
write_protect_metadata = true

# Extend guard size for large allocations.
large_guard_size = 65536

# Max allocation size before switching to mmap.
mmap_threshold = 131072

# Use MADV_DONTNEED instead of MADV_FREE for more predictable behavior.
use_madv_dontneed = true
