# Nuxel PWNAGE-SSP: opt in to unprivileged user namespaces.
#
# The Samsung 4.14 downstream tree keeps its CONFIG_LOD_SEC "non-root in the
# initial user namespace" gate and, since the Nuxel port, also gates
# create_user_ns() behind `kernel.unprivileged_userns_clone` (default 0).
# Per-app network confinement (services/nuxel-firewall) and Flatpak/bubblewrap
# both need an unprivileged user namespace to work, so the firewall install
# enables the knob here instead of each caller poking /proc by hand.
#
# Installing this file is the security decision: it is only shipped together
# with the cgroup/classid firewall ruleset that gives the namespace its
# purpose.  Remove the file (and the drop-in symlink) to go back to the
# strict default.
kernel.unprivileged_userns_clone = 1
