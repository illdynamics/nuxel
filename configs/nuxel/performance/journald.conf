# Nuxel journal size/retention bounds.
#
# The vendor kernel emits a very large volume of driver diagnostics (Wi-Fi
# runtime-PM, sensor-hub and watchdog lines).  Keep a useful recent window but
# do not let the journal grow without bound on a phone-sized rootfs.
[Journal]
SystemMaxUse=512M
SystemMaxFileSize=64M
RuntimeMaxUse=64M
# Keep the current flush cadence (systemd default) but never fsync every line.
SyncIntervalSec=5m
