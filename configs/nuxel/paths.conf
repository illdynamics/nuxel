# Nuxel path configuration — single source of truth (briq-20)
#
# All Nuxel services, the first-boot wizard, the sandbox (nftables.sh /
# sandbox.c) and the bootstrap scripts source/read this file to resolve the
# canonical runtime, data, config, and log directories. Values here may be
# overridden at runtime with the matching NUXEL_* environment variable.
#
# Format: KEY=VALUE (one per line). Lines starting with '#' are comments.

NUXEL_CONFIG_DIR=/etc/nuxel
NUXEL_DATA_DIR=/var/lib/nuxel
NUXEL_PERMISSIONS_DIR=/var/lib/nuxel/permissions
# Canonical single-file notification history store (briq-07). The daemon
# writes /var/lib/nuxel/notifications.json (overridable via the
# NUXEL_NOTIFICATIONS_FILE env var at runtime). NUXEL_NOTIFICATIONS_DIR is
# retained below ONLY as a legacy migration fallback; new installs use the
# single-file NUXEL_NOTIFICATIONS_FILE path.
NUXEL_NOTIFICATIONS_FILE=/var/lib/nuxel/notifications.json
NUXEL_NOTIFICATIONS_DIR=/var/lib/nuxel/notifications
NUXEL_APP_DIR=/var/app
NUXEL_SANDBOX_DIR=/opt/nuxel/sandbox
NUXEL_LOG_DIR=/var/log/nuxel
NUXEL_RUN_DIR=/run/nuxel
NUXEL_FIRSTBOOT_MARKER=/var/lib/nuxel/.firstboot-complete

# ── Canonical markers (single source of truth) ────────────────────────────
#
# First-boot marker:
#   Presence of NUXEL_FIRSTBOOT_MARKER (/var/lib/nuxel/.firstboot-complete)
#   means first-boot setup has NOT finished; the wizard removes it on
#   completion. Consistent across the OpenRC first-boot init, the
#   nuxel-firstboot wizard, the phosh agent, and vm/nuxel-vm-bootstrap.sh.
#
# Notification persistence (canonical single-file source, briq-07):
#     NUXEL_NOTIFICATIONS_FILE=/var/lib/nuxel/notifications.json
#   The daemon resolves NUXEL_NOTIFICATIONS_FILE (env -> this paths.conf ->
#   built-in default /var/lib/nuxel/notifications.json) and writes its whole
#   history to that single JSON file, capped at NUXEL_NOTIFICATIONS_HISTORY_CAP
#   entries (oldest evicted first). NUXEL_NOTIFICATIONS_DIR remains only as a
#   legacy migration fallback so older installs that pinned
#   {NUXEL_NOTIFICATIONS_DIR}/history.json stay readable while being re-written
#   to the canonical single file. The packaged systemd unit and the OpenRC
#   firstboot/notifications scripts pin NUXEL_NOTIFICATIONS_FILE to the
#   canonical path, and nuxel-home reads the same file, so a restart never loses
#   delivered/active notification history and no duplicate storage is created.
