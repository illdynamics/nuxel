# NUXEL 26000 Tri-Link Console Revolution — WLAN/USB SSH policy.
#
# The host-side launcher verifies the pinned host key before it connects. This
# file only controls the server side; it deliberately does NOT bind a wildcard
# address. Access is limited to the Nuxel owner account from the two Nuxel
# console subnets and loopback. Password and keyboard-interactive login remain
# disabled; only public-key authentication is accepted.
#
# WLAN (NetworkManager "Nuxel Snoerbreuk" at the time of provisioning):
#   10.20.30.0/24
# USB gadget network (reserved by nuxel-usb-net; see docs):
#   10.15.19.0/24
#
# Every keyword here wins over the Fedora default because this file is the
# last lexical drop-in (60-) included by /etc/ssh/sshd_config.d/*.conf.

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
AuthenticationMethods publickey

AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no

MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 30
ClientAliveCountMax 3
MaxSessions 4
MaxStartups 10:30:60

# The user@host syntax is enforced by sshd itself. A connection from any other
# address is refused before authentication, even though port 22 is listening on
# all interfaces (the kernel has no nft/iptables binary on this image; see the
# capability report). Do not replace this with a wildcard AllowUsers entry.
AllowUsers nuxel@10.20.30.0/24 root@10.20.30.0/24 nuxel@10.15.19.0/24 root@10.15.19.0/24 nuxel@127.0.0.1/32 root@127.0.0.1/32
