# NUXEL-105200: never start sshd without the owner's LAN in the allowlist.
# Install as /etc/systemd/system/sshd.service.d/20-nuxel-lan-allow.conf (or
# ssh.service.d/ on units that use the Debian name).
#
# ExecStartPre runs before sshd validates its config, so the drop-in this script
# writes is part of the very first config parse after boot.  The script is
# idempotent and exits 0 when the line is already correct; a write failure is
# logged but does not stop sshd (a console without LAN is still better than no
# console at all -- the USB ACM console is unaffected either way).
[Unit]
Wants=network-online.target
After=systemd-tmpfiles-setup.service

[Service]
ExecStartPre=-/usr/lib/nuxel/nuxel-ssh-lan-allow
