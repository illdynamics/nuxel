# Network SSH is owner-overlay-only. ZeroTier's own transport and local IPC
# are independent; this daemon never opens a LAN or wildcard listener.
AddressFamily inet
ListenAddress 10.11.12.99
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin prohibit-password
AllowUsers root@10.11.12.0/24 nuxel@10.11.12.0/24
