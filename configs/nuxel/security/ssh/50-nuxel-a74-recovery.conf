# NUXEL A74 root recovery key, preserved by NUXEL-26000.
#
# The original file contained an unrestricted `AllowUsers root`. OpenSSH
# accumulates AllowUsers across drop-ins, so that line would have overridden the
# Tri-Link CIDR restriction in 60-nuxel-tri-link.conf and allowed root key login
# from any address. The root key itself is NOT changed; root is now allowed only
# from the local WLAN, the USB console subnet and loopback by the 60- drop-in.
PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
