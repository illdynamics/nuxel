# PWNAGE-47000: owner-only local port forwarding for the GUI remote-desktop
# services. Global forwarding remains OFF (60-nuxel-tri-link.conf); this drop-in
# re-enables LOOPBACK-destination local forwards only, for the two fixed server
# ports. The server ports themselves stay bound to 127.0.0.1.
AllowTcpForwarding local
PermitOpen 127.0.0.1:5900 127.0.0.1:3389
