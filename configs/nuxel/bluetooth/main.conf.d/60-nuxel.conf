# Nuxel Bluetooth policy drop-in for the S10+ (beyond2lte), Broadcom BCM4375.
# Install to /etc/bluetooth/main.conf.d/60-nuxel.conf  (BlueZ merges drop-ins
# from main.conf.d/ in lexical order; 60- sorts after the distro default so a
# Nuxel value wins).
#
# Deliberate choices:
#   * AutoEnable = false — NOTHING powers the adapter at boot. The owner enables
#     it explicitly (nuxel-bluetooth-diag.sh on), so a bring-up failure can
#     never change the phone's behaviour at startup.
#   * ControllerMode = dual — the BCM4375 is a dual-mode (BR/EDR + LE) part, but
#     claiming LE without an observation would be dishonest; the diagnostic
#     reports what the controller actually advertises.
#   * Privacy = device — resolvable private addresses by default; no static
#     address is ever written to the repository.
#   * No `[Policy] AutoEnable=true`, no device allow-list, no stored link keys in
#     this file: pairing state is owner data and lives in /var/lib/bluetooth.

[General]
Name = Nuxel
Class = 0x5A020C
ControllerMode = dual
# Keep the adapter off until an owner turns it on (see [Policy] below).
FastConnectable = false
Privacy = device
Experimental = true
JustWorksRepairing = confirm
MultiProfile = off

[Policy]
# AutoEnable is the key that would power the radio at boot. It is explicitly OFF.
AutoEnable = false
# Reconnect only to already-trusted peers, never to unknown devices.
ReconnectAttempts = 3
ReconnectIntervals = 1,2,4
