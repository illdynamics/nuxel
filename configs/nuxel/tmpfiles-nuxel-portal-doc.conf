# PWNAGE-85000: runtime directories used by the user-session xdg-document-portal
# and the accessibility bus.  The document portal runs as nuxel and needs to
# open /dev/fuse; on this image /dev/fuse is root:root 0600 by default, which
# makes the portal mount fail and makes every Flatpak launch wait for the
# portal D-Bus reply.  These are permissions, not sandbox grants.
d /run/nuxel-wayland 0750 root nuxel -
d /run/nuxel-wayland/doc 0700 nuxel nuxel -
d /run/nuxel-wayland/at-spi 0700 nuxel nuxel -
# /dev/fuse is handled by nuxel-fuse-access.service (tmpfiles refuses the
# root-owned / path transition on this image).
