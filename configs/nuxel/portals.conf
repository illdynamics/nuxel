# Nuxel / Phoc portal backend selection (PWNAGE-56000).
#
# The session bus is per-user (/run/user/1000/bus) and owned by nuxel.  The GTK
# backend supplies FileChooser, Settings, Notification, Access, Email, Print,
# Account, Inhibit and DynamicLauncher without pulling in GNOME Shell.
#
# FileChooser goes to the Nuxel backend: one request/response flow with
# explicit Gallery and Files sources.  org.nuxel.Portal (the hardware
# permission broker) is a different service and is NOT used here.
#
# Screenshot/ScreenCast are deliberately NOT mapped: the wlr backend starts but
# cannot connect to this image's root-owned PipeWire socket, so advertising it
# would be a false capability.  The truthful status is in
# /run/nuxel-portal-ready.json and the Bridge Flatpak status API.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=nuxel
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Inhibit=gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Account=gtk
org.freedesktop.impl.portal.Email=gtk
org.freedesktop.impl.portal.DynamicLauncher=gtk
org.freedesktop.impl.portal.Settings=gtk
