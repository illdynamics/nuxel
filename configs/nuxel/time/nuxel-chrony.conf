# Nuxel timesync — chrony drop-in (fallback backend)
# Install: /etc/chrony.d/60-nuxel.conf
# Enable only if systemd-timesyncd is not usable:
#   sudo systemctl disable --now systemd-timesyncd
#   sudo systemctl enable  --now chronyd
#
# PACKAGE HONESTY: chrony must be verified as actually available in the real
# Fedora 43 ARM64 repository metadata before enabling this path
# (`dnf repoquery --arch aarch64 chrony`, recorded in the group's dependency
# report). This file existing is not evidence that chrony is installed, and
# `nuxelctl time status` reports the real state.
#
# WHY NOTHING KERNEL-VERSION-SPECIFIC IS USED: chrony's user-space clock
# steering works on any 4.x kernel; no PTP/hardware-timestamping feature is
# assumed. `hwtimestamp` is deliberately NOT enabled here because it requires a
# NIC/RTC that supports hardware timestamps, which is unverified on this device.

pool 2.fedora.pool.ntp.org iburst maxsources 3
pool 0.pool.ntp.org iburst maxsources 2

# Step the clock once at start-up if it is off by more than 1 s, at most 3 times.
# This is what makes a phone with a dead RTC usable after boot without lying
# about the fact that it was stepped.
makestep 1.0 3

# Keep the RTC in sync with the system clock (the same operation as
# `hwclock --systohc`, done continuously). This is the persistence mechanism
# that survives an ordinary reboot.
rtcsync

driftfile /var/lib/chrony/drift

# Do not accept time from an unauthenticated source over a long distance.
maxdistance 16.0

# Log clock changes so a stepped clock is visible in the evidence, not guessed.
logdir /var/log/chrony
log measurements statistics tracking
