# Nuxel timesync — systemd-timesyncd drop-in (preferred backend)
# Install: /etc/systemd/timesyncd.conf.d/60-nuxel-timesyncd.conf
#
# WHY THIS FILE: Fedora 43 ARM64 ships systemd-timesyncd as part of the systemd
# package (no separate package needed) and it is the backend that needs no
# additional daemon. chrony is the documented fallback
# (configs/nuxel/time/nuxel-chrony.conf) and is used only if timesyncd is
# absent or disabled — `nuxelctl time status` reports which one is actually
# running instead of assuming.
#
# Nothing here is 4.14-specific: NTP over UDP/123 needs no newer kernel feature.
# The polling bounds are widened from the Fedora default because a phone on
# mobile/Wi-Fi power-save wakes less often than a server.

[Time]
NTP=2.fedora.pool.ntp.org 1.fedora.pool.ntp.org 0.pool.ntp.org
FallbackNTP=2.fedora.pool.ntp.org 0.pool.ntp.org
RootDistanceMaxSec=5
PollIntervalMinSec=16
PollIntervalMaxSec=2048
ConnectionRetrySec=30
SaveIntervalSec=60
