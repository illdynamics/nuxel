# Nuxel: routing for USB tethering and the Wi-Fi hotspot.
#
# Both features share the phone's Wi-Fi uplink with an attached host, which is
# impossible while net.ipv4.ip_forward is 0.  The provider that finishes last
# used to restore the value it saw on start (0 after a previous stop), which
# silently disabled forwarding for the OTHER feature - the hotspot stayed
# "on" with dnsmasq answering DHCP but no packet was ever forwarded.
#
# 1 = enabled.  Only the two owners (nuxel-hotspot, usb_tether provider) ever
# touch it, and both now agree on 1.
net.ipv4.ip_forward = 1

# Loose reverse-path filtering.  Strict mode (1) drops forwarded replies when
# the reply's source route does not point back out of the same interface; on
# the 4.14 vendor kernel usb0/wlan0 defaulted to strict and every forwarded
# packet from the attached host was black-holed.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
