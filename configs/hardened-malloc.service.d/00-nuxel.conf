#==============================================================================
# systemd drop-in to run Nuxel services through hardened_malloc (per-service,
# never global — a global preload crashes Phosh/GTK/glycin)
#
# Installed to /etc/systemd/system/nuxel-*.service.d/00-nuxel.conf (or via a
# template wrapper). It preloads libhardened_malloc.so for every app/service
# governed by Nuxel, plus the security hardening knobs (abort, no THP mirrors,
# seccomp is added by the sandbox launcher, not this file).
#
# The LD_PRELOAD path must match where nuxel-vm-bootstrap.sh builds the
# library. On the Fedora/UTM VM that is /usr/local/lib/libhardened_malloc.so
# (a global /etc/ld.so.preload must NOT be used: it crashes Phosh/GTK/glycin).
#
# To apply to a specific unit, symlink this file:
#   install -D -m0644 configs/hardened-malloc.service.d/00-nuxel.conf \
#     /etc/systemd/system/nuxel-bridge.service.d/00-nuxel.conf
#==============================================================================

[Service]
# Preload hardened_malloc into the nuxel service.
Environment=LD_PRELOAD=/usr/local/lib/libhardened_malloc.so

# Abort (with core/backtrace) on any allocator-detected corruption instead of
# continuing with undefined heap state.
Environment=HARDENED_MALLOC_ABORT_ON_ERROR=1

# Disable transparent huge pages for subprocesses so the allocator's
# guard/random slab mappings are honored.
Environment=HARDENED_MALLOC_TRANSPARENT_HUGEPAGE=never

# Drop guard slabs eagerly to harden the quarantine against probing.
Environment=HARDENED_MALLOC_DROP_GUARDS=1

# Shut down the tcache above this fill threshold to bound cache-target attacks.
Environment=HARDENED_MALLOC_TCACHE_SHUTDOWN_THRESHOLD=16777216

# Do not add a long-running daemon's own copies into the picture beyond the
# preload; keep the rest of the sandbox policy (seccomp + Landlock) to the
# Nuxel launcher (shell/nuxel-shell/nuxel-sandbox/).
