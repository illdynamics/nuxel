# Nuxel ALSA UCM2 profile — Google mustang built-in speaker (CS35L45 SmartAmp)
#
# Device : Google Pixel 10 Pro XL (mustang), Tensor G5
# Card   : "Card0" / "mustang"
# Codec  : Cirrus Logic CS42L43 (main codec) + 2x CS35L45 (smart amplifiers)
#
# The CS35L45 amplifiers connect to the CS42L43 via the I2S/TDM lines. On the
# downstream Google kernel they appear as a SoundWire/I2C AudioDSP endpoint with
# control names under the "Cirrus-CS35L45" card or as suffix controls on
# mustang card. We model both conventional playback controls and Cirrus DSP
# coefficient controls that may not be present on the bring-up card — each is
# guarded so missing controls are tolerated by alsaucm.
#
# Reference:
#   * downstream kernel: drivers/soundwire/cadence_master.c
#     sound/soc/codecs/cs35l45.c / cs35l45-i2c.c
#   * PMOS wiki: Cirrus-direct CS42L43 UCM used by PinePhone Pro & community
#     devices (https://wiki.postmarketos.org/wiki/Cirrus_CS42L43)
#   * ASoC UCM2 (Asahi/accel-alsa for Cirrus) SmartAmp syntax.

Comment "Nuxel mustang built-in speaker (CS35L45 + CS42L43)"

# Root verb always powers the main codec for any route.
SectionVerb {
    EnableSequence [
        cset "name='Mustang PCM Playback Switch' 1"
        # Guarded: only present on cards with full DSP mixer.
        cset "name='Cirrus CS35L45 Warm Feedback Enable' 0"
    ]

    DisableSequence [
        cset "name='Mustang PCM Playback Switch' 0"
    ]
}

SectionDevice."Speaker" {
    Comment "Built-in stereo speakers via two CS35L45 smart amplifiers"

    # Multiamp route — CS42L43 feeds the two CS35L45 over TDM/SoundWire.
    EnableSequence [
        # Left / right smart amplifier enable + any DSP control.
        cset "name='Speaker Left Switch' on"
        cset "name='Speaker Right Switch' on"
        cset "name='Speaker Left Volume' 0"
        cset "name='Speaker Right Volume' 0"

        # Headphone DAC must not also drive the speakers.
        cset "name='Headphone Switch' off"

        # Cirrus DSP sample-rate + coefficient controls (guarded).
        cset "name='Cirrus CS35L45 RX1 Volume' -10"
        cset "name='Cirrus CS35L45 RX2 Volume' -10"
        cset "name='Cirrus CS35L45 TX1 Volume' -10"
    ]

    DisableSequence [
        cset "name='Speaker Left Switch' off"
        cset "name='Speaker Right Switch' off"
    ]
}
