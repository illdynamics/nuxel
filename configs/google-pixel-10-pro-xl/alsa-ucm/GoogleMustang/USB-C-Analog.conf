# Nuxel ALSA UCM2 profile — Google mustang USB-C / headset analog route
#
# Device : Google Pixel 10 Pro XL (mustang), Tensor G5
# Card   : "Card0" / "mustang"
# Codec  : Cirrus Logic CS42L43 (main codec) + CS35L45 (smart speakers)
# Model  : Downstream Google kernel audio topology (android-gs-mustang-6.12).
#
# This UCM file routes audio to the USB-C headset analog path on the CS42L43
# codec. The CS35L45 smart amplifiers are not driven during headset playback.
#
# Install:
#   sudo mkdir -p /usr/share/alsa/ucm2/GoogleMustang
#   sudo cp USB-C-Analog.conf Speaker.conf Headphones.conf VoiceCall.conf \
#        /usr/share/alsa/ucm2/GoogleMustang/
#   sudo alsactl init

Comment "Nuxel mustang USB-C analog headset route (CS42L43)"

# Card selectors (values must match the probed card index/name on mustang).
# UCM2 matches by the card "name" set below; adjust to the actual PCM device
# discovered in the downstream kernel (e.g. "DSP-Card" on some SoCs).
SectionDevice."USB-C-Analog" {
    Comment "USB-C/PCM headset output on CS42L43"

    EnableSequence [
        # Bring up the PCM interface. On downstream gs-mustang the audio DSP
        # (ADSP) owns the backend; UCM toggles the frontend DAI.
        cset "name='Mustang PCM Playback Switch' 1"

        # Route headset DAC volume (linear range 0..255 for CS42L43 gain)
        cset "name='Headphone Volume' 0"

        # Mute the internal Smart-Amp path while headset is active to avoid
        # driving the CS35L45 into the connector.
        cset "name='Speaker Left Switch' 0"
        cset "name='Speaker Right Switch' 0"

        # Enable the headset amp / DAC switch.
        cset "name='Headphone Switch' on"

        # Mic path (headset mic) via CS42L43 ADC.
        cset "name='Headset Mic Switch' on"
        cset "name='Headset Mic Capture Volume' 0"
    ]

    DisableSequence [
        cset "name='Headphone Switch' off"
        cset "name='Headset Mic Switch' off"
        cset "name='Mustang PCM Playback Switch' 0"
    ]
}
