# Nuxel ALSA UCM2 profile — Google mustang voice call (telephony)
#
# Device : Google Pixel 10 Pro XL (mustang), Tensor G5
# Card   : "Card0" / "mustang"
# Codec  : Cirrus Logic CS42L43 + two CS35L45 (smart speakers) during calls
#
# The Exynos 5500 modem's audio (voice + VoLTE) is delivered to the AP audio
# pipeline; UCM routes it to the earpiece + smart speakers and the microphone.
# The precise mixer names are modelled on the downstream Google kernel and the
# ASoC UCM2 "Telephony" conventions used by Phosh/ModemManager on Cirrus devices.
#
# NOTE: This profile targets the carrier audio path. Until VoLTE/IMS is enabled
# the routing is identical to the media path but with echo-cancellation/audio
# focus semantics that PipeWire enforces via the "voice-call" WirePlumber
# profile (see configs/wireplumber/nuxel-voice-call.lua.d/).

Comment "Nuxel mustang voice call route (CS42L43 + CS35L45)"

SectionVerb {
    EnableSequence [
        cset "name='Mustang PCM Playback Switch' 1"
        cset "name='Mustang PCM Capture Switch' 1"
    ]

    DisableSequence [
        cset "name='Mustang PCM Playback Switch' 0"
        cset "name='Mustang PCM Capture Switch' 0"
    ]
}

SectionDevice."VoiceCall" {
    Comment "Full-duplex voice path for the Exynos 5500 modem"

    EnableSequence [
        # Playback: earpiece/primary + smart speakers at call-safe levels.
        cset "name='Headphone Switch' on"
        cset "name='Headphone Volume' -25"
        cset "name='Speaker Left Switch' on"
        cset "name='Speaker Right Switch' on"
        cset "name='Speaker Left Volume' 0"
        cset "name='Speaker Right Volume' 0"

        # Capture: internal microphone through CS42L43 ADC.
        cset "name='Internal Mic Switch' on"
        cset "name='Internal Mic Capture Volume' 0"
        cset "name='Headset Mic Switch' off"

        # Cirrus DSP AEC / voice tuning (guarded).
        cset "name='Cirrus CS35L45 AEC Enable' 1"
    ]

    DisableSequence [
        cset "name='Headphone Switch' off"
        cset "name='Speaker Left Switch' off"
        cset "name='Speaker Right Switch' off"
        cset "name='Internal Mic Switch' off"
    ]
}
