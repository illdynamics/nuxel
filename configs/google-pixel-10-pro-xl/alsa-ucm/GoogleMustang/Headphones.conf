# Nuxel ALSA UCM2 profile — Google mustang 3.5mm-style / USB-C headphone (HIFI)
#
# Device : Google Pixel 10 Pro XL (mustang), Tensor G5
# Card   : "Card0" / "mustang"
# Codec  : Cirrus Logic CS42L43 (main codec)
#
# "Headphones" isolates the headphone DAC path on the CS42L43 codec, mirroring
# the downstream Google kernel mixer controls. This profile is the primary
# private-media path (music, media playback) to the headset.
#
# The CS35L45 smart speaker amplifiers remain muted while headphones are used.

Comment "Nuxel mustang headphone route (CS42L43)"

SectionVerb {
    EnableSequence [
        # Power up the codec DAC path.
        cset "name='Mustang PCM Playback Switch' 1"
    ]

    DisableSequence [
        cset "name='Mustang PCM Playback Switch' 0"
    ]
}

SectionDevice."Headphones" {
    Comment "Headphone playback via CS42L43"

    EnableSequence [
        cset "name='Headphone Volume' 0"
        cset "name='Headphone Switch' on"

        # Keep on-device smart amplifiers idle (no speaker output).
        cset "name='Speaker Left Switch' 0"
        cset "name='Speaker Right Switch' 0"

        # Capture path (headset mic).
        cset "name='Headset Mic Switch' on"
        cset "name='Headset Mic Capture Volume' 0"
    ]

    DisableSequence [
        cset "name='Headphone Switch' off"
        cset "name='Headset Mic Switch' off"
    ]
}
