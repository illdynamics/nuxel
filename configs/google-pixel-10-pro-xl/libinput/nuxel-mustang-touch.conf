# Nuxel libinput calibration for Google mustang (Samsung AMB655X touch)
#
# The Samsung S6SY791 touch controller inside the AMB655X LTPO panel is wired
# to the framebuffer. On bring-up we must rotate the touch coordinate space to
# match the portrait-native display; the canonical rotation matrix below maps a
# landscape-natural touch frame to the upright portrait output using the
# 90°-counter-clockwise calibration commonly applied to mobile SoC panels.
#
#   Calibration matrix (row-major):
#      0 -1  1
#      1  0  0
#      0  0  1
#
# This file is read by libinput at device-connect (Wayland/Phosh). It is NOT
# active on the VM (no S6SY791). 
#
# Install on mustang:
#   install -m0644 configs/libinput/nuxel-mustang-touch.conf \
#       /etc/libinput/local-overrides/nuxel-mustang-touch.conf
#   # (Wayland: the override dir is /etc/libinput/local-overrides/ on most
#   # distros; older ones use /etc/libinput/ directly.)
#   systemctl restart phosh 2>/dev/null || pulse-device-renumber
#
# Reference: the PMOS wiki S6SY791 calibration used for long-standing
# Samsung-panel wakeboard/Phosh bring-up on Cirrus-Direct devices stores the
# matrix as the string printed below.

MatchProduct "*S6SY791*"
MatchProduct "*AMB655X-Touch*"
MatchDevicePath "/dev/input/event*"

# Rotate touch to match the 1440x3120 portrait framebuffer.
Option "CalibrationMatrix" "0 -1 1 1 0 0 0 0 1"

# Opt-in tuning for the curved AMB655X glass.
Option "LeftHanded" "off"
Option "NaturalScrolling" "off"
Option "MiddleEmulation" "off"
Option "TapToClick" "on"
Option "TappingDrag" "off"
Option "DisableWhileTyping" "0"
Option "ScrollMethod" "none"

# Vary the palm-rejection inset sensibly for the tall panel (no fixed edge).
MatchIsTouchscreen "on"
