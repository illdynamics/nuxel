# Nuxel S10+ WirePlumber drop-in — device policy for the beyond-madera card
# Install: /etc/wireplumber/wireplumber.conf.d/51-nuxel-s10plus-audio.conf
#          (also read from ~/.config/wireplumber/wireplumber.conf.d/)
#
# TARGET: WirePlumber >= 0.5 (the version Fedora 43 ARM64 ships). The rule shape
# below — `monitor.alsa.rules` with `matches` / `actions.update-props` — is the
# documented 0.5 successor of 0.4's `alsa_monitor.rules`. The 0.4 equivalent is
# kept commented out so an older session manager does not choke on an unknown
# section:
#
#   alsa_monitor.rules = [
#     { matches = [ { node.name = "~alsa_output.*" } ]
#       actions = { update-props = { session.suspend-timeout-seconds = 0 } } }
#   ]
#
# WHAT THESE TWO RULES DO
#   1. Disable node autosuspend for ALSA output nodes: a suspended amplifier can
#      take tens of milliseconds to re-enable, which on a phone is heard as a
#      clipped first word. This is a real, bounded property change.
#   2. Keep the UCM-based device selection authoritative (`api.alsa.use-ucm`), so
#      the card's UCM2 profile (beyond-madera, see configs/alsa-ucm/) decides the
#      routes instead of a generic fallback profile guessing at them.
#
# WHAT THESE RULES DO NOT DO
#   They do not create sound, and they do not override the ALSA low-volume cap
#   (configs/pipewire/asound-nuxel-safe.conf). Audibility stays NEEDS_OWNER_TEST.
monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_output.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
    {
        matches = [
            { device.name = "~.*beyond-madera.*" }
            { device.nick = "~.*beyond.*" }
        ]
        actions = {
            update-props = {
                api.alsa.use-ucm = true
            }
        }
    }
]
