# Nuxel S10+ HiFi UCM2 use case — Samsung Galaxy S10+ (beyond2lte)
# Card: beyond-madera   Codec: CS47L93 (MADERA) + 2x CS35L40 smart amps + ABox
#
# THIS FILE SHIPS EMPTY SEQUENCES ON PURPOSE.
#
# Rationale (evidence discipline, mission sections 3-4): the MADERA/CS47L93
# mixer namespace is large and device-specific (ASoC DAPM widgets, DSP coeff
# controls, ABox routing). Writing plausible-looking control names here would
# make `alsaucm` fail at best and apply the WRONG route at worst, and a route
# that "applies" is not a route that produces sound. The concrete sequences are
# therefore generated from the live card:
#
#   nuxelctl audio capture     # reads amixer/alsactl output, writes
#                              #   /var/lib/nuxel/audio/controls.json (evidence)
#                              #   /var/lib/nuxel/audio/HiFi.conf.generated
#   nuxelctl audio ucm-install # atomic install of the generated file with a
#                              #   backup + hash verification + rollback
#   nuxelctl audio pipeline    # walks card -> PCM -> controls -> DAPM -> route
#                              #   and names the FIRST silent/broken stage
#
# The generated profile only ever contains controls that were OBSERVED, and
# every playback-volume control it sets is clamped to the low-volume cap from
# configs/nuxel/audio/audio.json (default 25 %) so the first bring-up can never
# produce a full-scale burst into the speaker or the wearer's ear.
Syntax 2

SectionVerb {
	Comment "CS47L93 MADERA codec power-up: populated from the captured control list"
	EnableSequence [
	]
	DisableSequence [
	]
}

