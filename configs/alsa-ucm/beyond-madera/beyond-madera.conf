# Nuxel UCM2 master profile — Samsung Galaxy S10+ (SM-G975F, beyond2lte)
# ALSA card name: "beyond-madera"  (the card name is the anchor: it is what
# /proc/asound/cards reports and what UCM2 requires the directory to be named)
# Install: /usr/share/alsa/ucm2/beyond-madera/beyond-madera.conf  (+ HiFi.conf)
#
# Codec chain on this device: Cirrus Logic CS47L93 (MADERA ASoC) as the main
# codec, two CS35L40 smart speaker amplifiers on the I2S/TDM lines, inside the
# Exynos 9820 audio subsystem (ABox). The codec DSP firmware
# (cs47l93-dsp*.wmfw) and the amplifier firmware (cs35l40-dsp*.wmfw) come from
# the stock vendor image; without them the codec DSP does not enumerate and no
# routing can be validated.
#
# WHAT IS AND IS NOT INVENTED HERE
#   * The card name, the codec chain and the file layout are real.
#   * NO mixer control name or value is invented. The EnableSequence of every
#     device is populated from a *captured* control list
#     (`nuxelctl audio capture` -> /var/lib/nuxel/audio/controls.json and
#     HiFi.conf.generated), because `tinymix`/`amixer` output from the real
#     handset is the only source of truth for names on this codec.
#   * A writable mixer control is NOT evidence of audible sound. Audibility is
#     NEEDS_OWNER_TEST (docs/beta-finalization/manual-proof/06-audio.md).
Syntax 2

Comment "Nuxel S10+ master UCM2 profile (CS47L93 MADERA + 2x CS35L40 + ABox)"

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Playback/capture — routes populated from a real captured control list"
}

SectionUseCase."VoiceCall" {
	File "VoiceCall.conf"
	Comment "Voice call path — no invented values; see docs/beta-finalization/system/ for status"
}
