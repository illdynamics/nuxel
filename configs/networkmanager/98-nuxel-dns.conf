# Nuxel DNS privacy defaults — DNS-over-HTTPS / DNS-over-TLS (briq-15 / briq-se1)
# Installed to /etc/NetworkManager/conf.d/98-nuxel-dns.conf
#
# Nuxel routes every host's DNS through a privacy-preserving encrypted resolver.
# This conf is SHIPPED with concrete transport config, not just documentation:
#
#   * Fedora / ARM64 VM (systemd-resolved):
#       - THIS file sets dns=systemd-resolved and a negative dns-priority so the
#         local stub on 127.0.0.53 / ::1 always wins over any DHCP-provided DNS.
#       - configs/networkmanager/resolved-conf.d/nuxel-privacy.conf is installed
#         to /etc/systemd/resolved.conf.d/nuxel-privacy.conf and provides the
#         ACTUAL DoH/DoT transport (pinned Cloudflare upstreams + DNSOverTLS).
#   * mustang / pure-OpenRC image (no systemd):
#       - set dns=none and install configs/networkmanager/nuxel-stubby.yml to
#         /etc/stubby/stubby.yml; stubby owns /etc/resolv.conf and encrypts.

[main]
# systemd-resolved owned stub: reads the resolved drop-in for the DoH/DoT
# transport. IPv6 is kept as a first-class stub endpoint.
dns=systemd-resolved

[connection]
# Negative DNS priority: our encrypted stub must preempt any DHCP-provided
# resolver. Applies to both address families, including IPv6 (::1 stub).
ipv4.dns-priority=-1
ipv6.dns-priority=-1

# ---- Default connection DNS (fallback / resolution hints) ----
# These are the encrypted upstream addresses the stub is configured to use.
# They are only consulted when a manual/connection-specific DNS override is
# absent, and they are sent to systemd-resolved over the IPv6 ::1 loopback.
# Cloudflare DoH (IPv4):
ipv4.dns=1.1.1.1 1.0.0.1
# Cloudflare DoH (IPv6) + ::1 local stub (IPv6 support — briq-15):
ipv6.dns=2606:4700:4700::1111 2606:4700:4700::1001 ::1

# ---- Transport: /etc/systemd/resolved.conf.d/nuxel-privacy.conf ----
# Installed from configs/networkmanager/resolved-conf.d/nuxel-privacy.conf
#   [Resolve]
#   DNS=1.1.1.1 1.0.0.1
#   FallbackDNS=2606:4700:4700::1111 2606:4700:4700::1001 ::1 127.0.0.53
#   Domains=~.
#   DNSOverTLS=opportunistic
# On mustang/OpenRC use configs/networkmanager/nuxel-stubby.yml (same upstreams,
# tls_auth_name 1dot1dot1dot1.cloudflare-dns.com) at /etc/stubby/stubby.yml.
