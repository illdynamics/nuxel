# Nuxel privacy defaults — NetworkManager MAC randomization (briq-15)
# Installed to /etc/NetworkManager/conf.d/98-nuxel-defaults.conf
# Loaded before 99-test.conf, after keyfile plugin — deterministic ordering.

[connection]
# Randomize the per-SSID MAC for every WiFi connection by default.
wifi.mac-address-randomization=1
wifi.cloned-mac-address=random
wifi.scan-rand-mac-address=yes

[device]
wifi.scan-rand-mac-address=yes

# Global default is randomize for all WiFi; connections can opt out by
# explicitly setting wifi.cloned-mac-address=permanent.
