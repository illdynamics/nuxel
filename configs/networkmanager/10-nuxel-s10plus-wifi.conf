# Nuxel Wi-Fi global defaults — Samsung Galaxy S10+ (SM-G975F, beyond2lte, Exynos 9820)
# Install: /etc/NetworkManager/conf.d/10-nuxel-s10plus-wifi.conf
#
# WHY THIS FILE EXISTS (briq-03a, mission area 4)
#   The S10+ Wi-Fi part is a Murata/Broadcom BCM4375-class module behind the
#   Samsung SDIO/PCIe glue (driver family: vendor bcmdhd, or brcmfmac when the
#   in-tree driver matches). It is NOT the Google Pixel BCM4390 documented in
#   docs/wifi-bcm4390-status.md — that document MUST NOT be applied here.
#
#   Nothing in this file claims the radio works. It only states the
#   NetworkManager policy that is correct *if and when* a driver binds and a
#   firmware blob is present, so the policy is not invented at bring-up time.
#   Live association stays NEEDS_OWNER_TEST (see
#   docs/beta-finalization/manual-proof/04-wifi.md).
#
# Load order: 10- (this file) before 98-nuxel-defaults.conf (MAC randomization
# privacy defaults, briq-15). Later files win on conflicting keys, which is why
# the privacy defaults keep the final say on randomization.
#
# Verify the merged configuration on the running system with:
#     NetworkManager --print-config | sed -n '/^\[device\]/,$p'
# Unknown keys are reported by NetworkManager as warnings: treat any warning
# here as a defect, not as a feature.

[device]
# The on-device Wi-Fi netdev name observed on this image is wlan0; the fallback
# list covers a driver that registers a different name (e.g. wlp*). Listing both
# is what makes this file correct-by-construction instead of name-guessing.
wifi.ifname=wlan0,wlp1s0,wifi0
# iwd is NOT installed in this image (checked in the Fedora 43 ARM64 package
# manifest); wpa_supplicant is the only Wi-Fi supplicant present, so it is pinned
# instead of left to auto-detection.
wifi.backend=wpa_supplicant
# Randomize the MAC used for *scans* too: a fixed scan MAC leaks presence.
wifi.scan-rand-mac-address=yes

[connection]
# Wi-Fi power save (2 = disable). Aggressive PS on Broadcom SDIO parts drops
# the association / delays scans. Level 2 is the honest "do not fight the
# firmware" default for bring-up; it costs battery and can be re-enabled once
# association is proven.
wifi.powersave=2
# Stable IPv6 privacy addresses: no interface identifier derived from the MAC.
ipv6.ip6-privacy=2
# Bound the autoconnect retry storm. A radio whose driver is still settling
# must not be hammered with associate attempts that fill the journal and mask
# the real bring-up failure.
connection.autoconnect-retries=3

# Per-interface overrides, if a future radio needs them, belong in explicit
# [device-wlan0] / [device-<ifname>] sections. This file deliberately defines
# none: no interface beyond the [device] wifi.ifname list above is assumed, and
# a wildcard section name is not valid NetworkManager conf syntax.
