# Nuxel DNS privacy — systemd-resolved DoH/DoT transport (briq-15 / briq-se1)
# Installed to /etc/systemd/resolved.conf.d/nuxel-privacy.conf
#
# This is the *transport* half of the NetworkManager privacy defaults. The NM
# conf (configs/networkmanager/98-nuxel-dns.conf) tells NetworkManager to
# delegate DNS to the systemd-resolved stub on 127.0.0.53 / ::1 and to prefer
# that stub over any DHCP-provided resolver. THIS file is what makes the stub
# actually encrypt: it pins the encrypted upstream and enables DNS-over-TLS.
#
# With DNSOverTLS=opportunistic, every query the stub forwards to the pinned
# upstream is encrypted (DoT) where the server supports it; Cloudflare
# 1dot1dot1dot1 do — so both DoH and DoT are exercised depending on transport.

[Resolve]
# Encrypted upstream (Cloudflare DoH + DoT anycast pair). IPv4 first.
DNS=1.1.1.1 1.0.0.1
# IPv6 encrypted upstream + IPv6 loopback stub endpoint (first-class IPv6).
FallbackDNS=2606:4700:4700::1111 2606:4700:4700::1001 ::1 127.0.0.53
# Route *all* lookups through the stub, never let an interface DHCP DNS win.
Domains=~.
# Opportunistic DoT to the upstream above. Requires the stub to be authoritative
# for every name, which Domains=~. guarantees.
DNSOverTLS=opportunistic
# Never use a plaintext upstream even when the stub has none configured.
DNSStubListenerLocal=no
