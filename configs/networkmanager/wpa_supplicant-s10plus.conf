# Nuxel wpa_supplicant configuration — Samsung Galaxy S10+ (beyond2lte)
# Install (NetworkManager-less / OpenRC path only):
#     /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
#     systemctl enable --now wpa_supplicant@wlan0   # Fedora unit template
#
# On the normal Fedora path NetworkManager spawns its own wpa_supplicant with a
# D-Bus control interface, and this file is documentation of the required
# parameters rather than the live instance. It is shipped so that the
# non-NetworkManager path cannot silently drift from the NM path.
#
# HONESTY: no driver= line. nl80211 (the default since wpa_supplicant 2.6) is
# what the Fedora 43 build uses; pinning driver=wext would be a fabricated
# workaround for a driver that may not exist at all.

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=wheel
# "00" = 802.11d world regulatory domain (no country assumption is invented).
# The owner sets the real ISO-3166 code with:  nuxelctl wifi regdom <CC>
country=00
# NetworkManager (or this file's owner) is the single writer of profiles.
update_config=0
# Wi-Fi Direct is not used by Nuxel; leaving it enabled just widens the attack
# surface and confuses the SDIO part's firmware.
p2p_disabled=1
# Bound the BSS cache: unbounded caches are what makes scans crawl on
# Broadcom-class firmware.
bss_max_count=64
# Do not filter SSIDs by default: hidden networks stay reachable for the owner.
filter_ssids=0
# Never let wpa_supplicant decide to connect to an unknown open AP on its own.
disable_scan_offload=0
