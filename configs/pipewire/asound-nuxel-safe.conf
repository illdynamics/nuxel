# Nuxel audio ceiling (100%; low-volume-only retired 2026-10-30) — ALSA softvol chain (install as /etc/asound.conf)
#
# WHY THIS EXISTS (briq-03c: "LOW-VOLUME-ONLY default; a writable mixer control
# is NOT an acceptance criterion")
#
#   The first bring-up of an unknown amplifier path must be incapable of a
#   full-scale burst into the speaker — not merely configured not to. A softvol
#   plugin in front of the hardware device makes that a property of the ALSA
#   layer, where it cannot be bypassed by a session-manager default, a PipeWire
#   restore of a stored volume, or a tool that writes the mixer directly:
#
#       default -> softvol (Nuxel Safe Volume, max_dB = 0.0) -> hw:0,0
#
#   max_dB caps the *digital* gain at full scale (0 dB) (a ceiling, not a
#   target); applications that open `default` cannot exceed it. The user's
#   `Master`/codec volume still works normally below the ceiling, so this is not
#   a "volume that cannot be turned up" bug — it is a hard limit.
#
#   Use `nuxelctl audio safe-volume` to read back and (within the cap) adjust it;
#   for a real bring-up session on the bench, `pcm.!default` can be pointed at
#   `hw:0,0` explicitly, which is a deliberate, logged act — not a default.
#
# WirePlumber/PipeWire normally open the ALSA device through its own plugin and
# therefore bypass this chain; this file is the guarantee for ALSA consumers and
# the reference for the cap value used by `nuxelctl audio capture` when it
# generates the UCM volume csets.

pcm.!default {
    type            softvol
    slave.pcm       "hw:0,0"
    control {
        name        "Nuxel Safe Volume"
        card        0
    }
    min_dB          -51.0
    max_dB           0.0
    resolution      256
}

ctl.!default {
    type hw
    card 0
}
