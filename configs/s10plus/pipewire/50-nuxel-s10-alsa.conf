# Nuxel S10+ (beyond2lte): static ALSA PCM sink.
#
# This image has no udev daemon, so WirePlumber's api.alsa.enum.udev monitor
# cannot enumerate the beyond-madera card and the session falls back to a
# Dummy Output.  The Samsung RDMA1 PCM is the working 48 kHz playback route
# on the live unit (44.1 kHz leaves hw_ptr at 0 and aplay returns EIO; RDMA0
# does not advance at all).  Create it directly through the SPA
# api.alsa.pcm.sink adapter; this path does not probe the MADERA mixer control
# that hangs I2C and does not depend on udev.
#
# PWNAGE-87000: this is a STATIC node, so WirePlumber monitor.alsa.rules never
# applies to it.  The node must never be suspended: on this vendor 4.14 kernel
# a later amixer open can block in rpm_resume, and suspending the RDMA1 node
# powers down the DAPM SPEAKER path.  soundd keeps one persistent pw-cat stream
# feeding silence so a short cue is not swallowed by the CS35L41 power-up ramp;
# a suspended sink deadlocks that stream (pipe fills, soundd blocks in write)
# and every queued cue stalls.  Pin the node always-processing here, at the
# PipeWire level, and set session.suspend-timeout-seconds=0 so WirePlumber's
# suspend-node.lua never suspends it either.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "alsa_output.hw_0_1"
      node.description = "S10+ speaker (RDMA1, 48 kHz)"
      media.class      = "Audio/Sink"
      priority.session = 1000
      api.alsa.path    = "hw:0,1"
      audio.format     = "S16LE"
      audio.rate       = 48000
      audio.channels   = 2
      node.suspend-on-idle = false
      node.pause-on-idle   = false
      node.always-process  = true
      session.suspend-timeout-seconds = 0
    }
  }
]
