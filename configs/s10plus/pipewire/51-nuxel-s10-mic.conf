# Nuxel S10+ (beyond2lte): static ALSA capture source for the built-in mics.
#
# The image deliberately does not run a udev daemon, so WirePlumber's
# api.alsa.enum.udev monitor cannot enumerate beyond-madera.  The speaker sink is
# created statically in 50-nuxel-s10-alsa.conf; this is the matching capture
# node.  WDMA1 is the AP-record PCM used by the vendor mixer_paths.xml
# ("route-ap-record" -> route-uaif0-to-nsrc0 + route-nsrc0-to-wdma1); WDMA0 is
# the RSRC0/reference path and must not be presented as the microphone.
#
# nuxel-mic-route.sh applies the codec/ABOX capture route before any client
# opens this node.  Keeping the node static means the microphone privacy tile
# sees a real (non-monitor) PipeWire source even before the first recording.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name     = api.alsa.pcm.source
      node.name        = "alsa_input.hw_0_13"
      node.description = "S10+ microphone (WDMA1, 48 kHz)"
      media.class      = "Audio/Source"
      priority.session = 1000
      api.alsa.path    = "hw:0,13"
      audio.format     = "S16LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = "FL,FR"
      api.alsa.period-size = 1024
      api.alsa.headroom    = 0
    }
  }
]
