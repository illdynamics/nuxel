# Samsung S6SY761 sec_ts touch calibration for S10+ (3040×1440)
# Device: Samsung Galaxy S10+ (beyond2lte)
# Touch controller: S6SY761 (sec_ts), I2C hsi2c_10 @ 0x48
#
# This InputClass is the X11 form of the touch calibration (installed to
# /etc/X11/xorg.conf.d/99-nuxel-beyond2lte-touch.conf on the S10+ target).
# On Wayland/Phosh the same MatchProduct/MatchIsTouchscreen properties are
# honoured by libinput's udev-based device matching; the TransformationMatrix
# below is the identity (panel and framebuffer share orientation) and the
# CalibrationMatrix stays commented out until Phase 0 (`getevent -pl` /
# `libinput debug-events`) provides real values. No values are invented.

Section "InputClass"
    Identifier "nuxel-s10plus-touch"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    # S6SY761 presents as "sec_touchscreen" in kernel
    MatchProduct "sec_touchscreen"
    Driver "libinput"
    Option "TransformationMatrix" "1 0 0 0 1 0 0 0 1"
    # Calibration values — fill from real device (libinput debug-events)
    # Option "CalibrationMatrix" "UNKNOWN UNKNOWN UNKNOWN UNKNOWN UNKNOWN UNKNOWN"
EndSection
