# Nuxel S10+ ALSA default: RDMA0's DSP task does not advance on this unit,
# while RDMA1 runs at 44.1 kHz (verified with a bounded low-level tone through
# both ALSA direct and the static PipeWire sink).  Keep control access on card 0
# and send the default playback PCM to RDMA1.  The `plug` layer lets 48 kHz ALSA
# consumers open the 44.1 kHz hardware PCM.
pcm.!default {
    type plug
    slave.pcm {
        type hw
        card 0
        device 1
    }
}

ctl.!default {
    type hw
    card 0
}
