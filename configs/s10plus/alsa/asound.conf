# Nuxel S10+ ALSA default: RDMA0's DSP task does not advance on this unit,
# while RDMA1 runs at 48 kHz on the live unit (44.1 kHz returns EIO with
# hw_ptr stuck at 0; verified with a bounded low-level aplay).  Keep control access on card 0
# and send the default playback PCM to RDMA1.  The `plug` layer lets 44.1 kHz
# ALSA consumers open the 48 kHz hardware PCM.
pcm.!default {
    type plug
    slave.pcm {
        type hw
        card 0
        device 1
    }
}

ctl.!default {
    type hw
    card 0
}
