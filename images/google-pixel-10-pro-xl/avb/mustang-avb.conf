#==============================================================================
# Nuxel AVB (Android Verified Boot) configuration — mustang (Pixel 10 Pro XL)
#
# Defines the AVB boot chain, partition policies, and signing parameters used
# by images/avb/sign.sh. Referenced by boot/flash.sh for the production relock
# path (state=locksigned).
#
# AVB is the second line of defense after dm-verity: it authenticates the boot
# chain (bootloader → vtbl → vbmeta → boot/dtbo/system) so that only images
# signed by the Nuxel owner key are allowed to boot.
#
# Generation notes:
#   * Build an RSA-2048 signing key (or use avbtool's bundled test key first).
#   * All boot-time partitions (boot, dtbo, system, vendor) get a vbmeta
#     footer (`add_hash_footer` for raw images, `add_image_footer` for built
#     images) chained to a single top-level vbmeta.img.
#   * vbmeta.img holds the public key (rolset) and is flashed to the vbmeta
#     partition; the bootloader reads its descriptor to verify the chain.
#==============================================================================

[avb]
# Top-level vbmeta partition image produced by sign.sh.
vbmeta_img=build/out/vbmeta.img

# Rollback index set into vbmeta. Must be a monotonically increasing integer
# (a nonce); bump it on every production release to prevent rollback attacks.
rollback_index=0
rollback_index_location=0

# Algorithm used for signing. avbtool supports cases; RSA2048 with SHA256 is
# the minimum recommended; RSA4096 is stronger but slower on older bootloaders.
algorithm=SHA256_RSA2048

# Do not allow the bootloader to disable verification for partitions that are
# supposed to be immutable. vbmeta.img carries the 'disable_verity' and
# 'disable_verification' flags as 0 for production.
disable_verity=false
disable_verification=false

# Chain-partition policies. Each entry is: <partition>:<algorithm>:<key>
# A dedicated sub-key per partition allows revocation of one partition without
# re-signing the whole chain; for simplicity we chain everything to the single
# Nuxel owner key here.
#   boot
#   init_boot
#   dtbo
#   system
#   vendor
chain_partitions=boot,system,vendor

# --- Owner key material (paths under ./keys unless overridden by env) ---
key_public=keys/nuxel-avb-public.bin
key_private=keys/nuxel-avb-private.pem

# --- Per-partition policy overrides ---
#
# boot / vendor_boot / init_boot are kernel+ramdisk images; get image footer.
[partition.boot]
type=boot
image=build/out/boot.img
props_skipped=

[partition.init_boot]
type=boot
image=build/out/init_boot.img

[partition.dtbo]
type=dtbo
image=build/out/dtbo.img

[partition.system]
type=verity
image=build/out/system.img
fec=true            # forward error correction for the rootfs hash tree
# IMPORTANT: When dm-verity on the actual mustang uses an on-disk hash footer,
# avbtool adds the hash tree to the system image. If instead a separate hash
# partition is used (see images/config/verity.conf), set:
#use_separate_hash=false
# and instruct sign.sh to write the hash tree to build/out/hash.img.

[partition.vendor]
type=raw
image=build/out/vendor.img
