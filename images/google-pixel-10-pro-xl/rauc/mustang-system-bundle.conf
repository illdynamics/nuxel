# Nuxel RAUC system.conf for Google Pixel 10 Pro XL (mustang) / postmarketOS
#
# This file is the ON-DEVICE RAUC system configuration and is also used as
# the bundle descriptor for `rauc bundle assembly`.
#
# Compatible string MUST match the bundle's `compatible=` manifest entry or
# RAUC refuses to install the update.
#
# See docs/update-strategy.md for the full update workflow.

[system]
compatible=nuxel-mustang
# Keyring path on the device: this file contains only PUBLIC keys and is
# embedded into the rootfs image. The corresponding private signing key lives
# on the build host only.
keyring-path=/etc/rauc/keyring.pem

# Additional trusted anchor bundle files are merged into the keyring.
springs-file=/etc/rauc/keyring.pem

# Default boot loader type. `uboot` stores RAUC bootstate in the bootloader
# environment variables; on mustang we use the A/B boot partitions managed by
# the bootloader. Use the simple `barebox` variant to avoid a config complexity
# when the bootloader scratch block is provided by fastboot partitions. We
# select `uboot` here because postmarketOS + U-Boot provides `bootstate`
# support for A/B selection and rollback.
bootloader=uboot

# Boot slot handled by the bootloader (boot_a/boot_b) used for slot state.
# RAUC writes "good"/"bad" markers here for rollback determination.
boot-slot-label=boot

# Activation strategy: on reboot the bootloader selects inactive slot.
strategy=classic

# Mark the running slot good automatically after a successful boot? This
# happens out-of-band from a oneshot service in production (see
# docs/update-strategy.md), but RAUC provides the option here.
# mark-good-after-install=true

#
# Slot definitions
#
[slot.boot.0]
device=/dev/disk/by-partlabel/boot_a
type=raw
bootname=boot_a

[slot.boot.1]
device=/dev/disk/by-partlabel/boot_b
type=raw
bootname=boot_b

[slot.rootfs.0]
device=/dev/disk/by-partlabel/system_a
type=raw
readonly=true

# The root filesystem is dm-verity protected; the verity setup is performed by
# images/hooks/verity-setup.sh during initramfs before RAUC runs. RAUC slots
# point at the literal device names.
[slot.rootfs.1]
device=/dev/disk/by-partlabel/system_b
type=raw
readonly=true

#
# Optional: enforce that the bundle payload never exceeds the slot size.
# Values are in bytes (example only; adjust to actual partition sizes).
# [slot.rootfs.0]
# size=4294967296
#
# [slot.rootfs.1]
# size=4294967296

#
# Custom handler hooks (optional, executed on device).
# [handlers]
# post-install=/usr/libexec/nuxel/rauc-post-install.sh
#
# The default handler simply syncs the bootloader state for rollback; the
# post-install hook can be used to refresh the initramfs bundled inside the
# root slot or to regenerate the verity hash tree.
