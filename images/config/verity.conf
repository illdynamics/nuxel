#==============================================================================
# Nuxel dm-verity configuration — mustang (Pixel 10 Pro XL)
#
# This file is installed to /etc/verity.conf on the device. It is read by
# images/hooks/verity-setup.sh (initramfs hook) to bring the protected root
# filesystem online.
#
# On mustang the root filesystem is written to the inactive slot as a raw
# ext4/erofs image whose hashes are computed by the build pipeline
# (images/avb/sign.sh runs `avbtool add_hash_footer`). The device tree /
# bootloader passes the root hash and the data device via `fastboot`-style
# cmdline or DT `bootargs`; the verity hash is provided on the kernel cmdline
# as `nuxel.verity_hash=<hex>`.
#
# The data and hash devices are boot-policy partitions:
#   * system_a / system_b → raw slot images
#   * hash tree lives in the "hash" partition, or in a footer that is
#     stripped at flash time (see images/avb/mustang-avb.conf).
#
# dm-verity mode: For the locked/production rootfs we use EROTIC/hash-tree
# integrity (read-only root with hash tree). The `restart_on_corruption`
# behavior below forces a reboot loop instead of reaching a read-write falldown.
#==============================================================================

# --- veritytab template ---
#
# The kernel/dm-init reads a veritytab entry to map <name> at boot. dm-init
# supports verity devices via a `dm-mod.create=` string; systemd-initrd reads
# /etc/veritytab. The template below is the systemd-initrd veritytab format.
#
#   <name>  <data_device>    <hash_device>  <root_hash>    [options]
#
# Replace @@DATA_DEVICE@@, @@HASH_DEVICE@@ and @@ROOT_HASH@@. `nuxel.verity_hash=`
# is a kernel cmdline parameter consumed by verity-setup.sh: when present it
# overrides the root hash, which is how the locked (production) device gets its
# root-of-trust from the bootloader rather than from untrusted storage.

# Template line (commented out — this exact line is generated by verity-setup.sh
# when veritytab is regenerated from the cmdline hash):
# verityroot  /dev/disk/by-partlabel/system_a  /dev/disk/by-partlabel/hash_a  @@ROOT_HASH@@  verity-options

# Resolution for offline generation:
#  1. Build the rootfs image and compute its verity hash root:
#        veritysetup format <rootfs.img> <hash.img> > hash.txt
#        ROOT_HASH=$(grep -o 'hash:[0-9a-f]*' hash.txt | cut -d: -f2)
#  2. Inject the hash into the boot cmdline:  nuxel.verity_hash=${ROOT_HASH}
#  3. On the device, verity-setup.sh generates the veritytab on the fly
#     from images/config/verity.conf + the cmdline value.

# --- device mapping ---
# Name under which the mapped, verified root block device appears.
verity_device_name=verityroot

# Block device used as the verity DATA device. On mustang this is the active
# system slot. Updated by the initramfs from the active-slot boot variable.
verity_data_device=/dev/disk/by-partlabel/system_a

# Block device used as the verity HASH device. Usually a dedicated hash
# partition (hash_a / hash_b) or the second half of the same partition if the
# hash footer is used. Choose per the AVB layout in images/avb/mustang-avb.conf.
verity_hash_device=/dev/disk/by-partlabel/hash_a

# Root hash: normally injected via kernel cmdline `nuxel.verity_hash=`.
# This placeholder is never used at runtime if the cmdline supplies the hash.
verity_root_hash=@@ROOT_HASH@@

# --- behavior options (dm-verity) ---
# strategy for handling corruption:
#   logonly            -> log and continue (dev only)
#   restart            -> halt + restart (recommended)
#   panic              -> kernel panic
#   restart_on_corruption -> (compat: added to options below)
verity_on_corruption=restart

# If set, try to use the "forward error correction" root from a
# /dev/dm-fec device. Leave empty unless the image was built with FEC.
verity_fec_device=

# Optional: mount read-only. The rootfs on mustang is always read-only.
verity_ro=1

# Extra passthrough args appended to the veritysetup invocation.
#
# NOTE: This field lands in the veritytab OPTIONS column, which expects
# veritysetup *option words* (e.g. restart_on_corruption), NOT CLI flags such
# as `--no-superblock`. Such flags are invalid in a systemd-initrd veritytab,
# so we keep this empty and let verity-setup.sh pass `--no-superblock` on the
# actual `veritysetup` command line where CLI flags are legal.
verity_extra_args=""
