# =============================================================================
# Nuxel — build images and publish a GitHub Release
#
# Triggers
#   * push to main (merged PR)   -> build the S10+ phone image, then create the
#                                  annotated v<VERSION> tag and publish the
#                                  GitHub release from the merge commit.  The
#                                  release is explicitly marked "Latest" so the
#                                  repository sidebar shows the newest build;
#                                  the -beta tag still declares the beta status.
#   * manual (workflow_dispatch) -> operator recovery only; never automatic
#
# Tag pushes deliberately do NOT trigger this workflow. main is protected and
# requires a pull request, so the normal release route is a merged PR.
#
# Supported devices (for now): g7power, s10plus.
#   mustang / google-pixel-10-pro-xl is intentionally NOT built here yet; it is
#   removed from the matrix until the two bring-up phones are proven end to end.
#
# Pipeline (per device, on its own runner):
#   make assets                          -> single-source PWA assets
#   images/build.sh --initramfs-only     -> shared (device-agnostic) initramfs
#   kernel/<dev>/build-kernel.sh --clone -> per-device Image.gz + DTBs (+ modules)
#   boot/g7power/lk2nd/build-lk2nd.sh    -> lk2nd.img (g7power only; required to boot)
#   images/g7power/build.sh --device     -> g7power boot + ext4 rootfs images
#   images/s10plus/build-a25-boot.sh     -> THE A25 BOOT IMAGE that runs on the
#                                           handset: repo-source initramfs
#                                           (tools/s10plus/build-a25-initramfs.sh)
#                                           EMBEDDED in a RAW arm64 kernel Image
#                                           (CONFIG_INITRAMFS_SOURCE) + merged
#                                           board DTB + legacy v1 boot.img.
#                                           Verify-boot-image.py-style gate:
#                                           tools/s10plus/verify-a25-boot.py.
#   images/s10plus/build.sh --phone-rootfs
#                                        -> s10plus Fedora 43 ARM64 phone rootfs
#                                           (arm64 container: podman + qemu binfmt)
#                                           The container now COMPILES the
#                                           current A34 TOUCHDOWN userspace
#                                           (nuxel-wl-fb, nuxel-pwa-host,
#                                           nuxel-button-manager, libinput shim,
#                                           nuxel-wl-snapshot) from repository
#                                           sources; it no longer depends on a
#                                           developer's build/out/a32 tree.
#   tools/verify-artifacts.sh --device   -> FAIL-CLOSED artifact verification
#   tools/package-release.sh             -> nuxel-<ver>-<dev>.tar.gz artifact
#
# Notes
#   * There is NO continue-on-error anywhere in the build matrix. If a device's
#     initramfs, kernel, or images are missing/invalid, the job goes RED and the
#     release job is skipped (a release is only ever published from a fully green
#     build). tools/verify-artifacts.sh is the explicit gate for that.
#   * The S10+ BOOT image is the A25 image that runs on the handset; the
#     userspace inside USERDATA is the current A34 TOUCHDOWN set. Two boot
#     properties
#     are non-negotiable on this board (docs/s10plus-autonomous-boot-repair/
#     INITRAMFS-DELIVERY-ROOT-CAUSE.md): the BOOT container carries a RAW arm64
#     Image (never Image.gz — S-Boot executes a gzip payload as code) and that
#     Image has the initramfs EMBEDDED, because S-Boot advertises the initrd
#     memory to the kernel without ever filling it. tools/s10plus/verify-a25-boot.py
#     fails the job if either is untrue. The retired shared Plymouth/Flatpak
#     rootfs is intentionally NOT built for s10plus (build.sh fails closed).
# =============================================================================
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manual recovery tag (e.g. v0.2.1). Empty => v<VERSION>.'
        required: false
        default: ''
      devices:
        description: 'Space-separated device keys (g7power s10plus).'
        required: false
        default: 's10plus'
      publish:
        description: 'Publish only after physical owner acceptance and all release gates.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve tag + devices
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      devices: ${{ steps.v.outputs.devices }}
      source_sha: ${{ steps.v.outputs.source_sha }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and device list
        id: v
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REQUESTED_DEVICES: ${{ github.event.inputs.devices }}
        run: |
          # An explicit manual tag must build that tag's commit, not the
          # branch from which the workflow was dispatched.
          if [ -n "$REQUESTED_TAG" ]; then
            requested_tag="v${REQUESTED_TAG#v}"
            [[ "$requested_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
              echo "::error::invalid requested version"; exit 1;
            }
            git show-ref --verify "refs/tags/$requested_tag" >/dev/null || {
              echo "::error::requested tag does not exist; omit tag for a nonpublishing branch build"; exit 1;
            }
            git checkout --detach "refs/tags/$requested_tag"
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
            echo "::error::VERSION must have at most one v prefix and a valid version"; exit 1;
          }
          canonical_tag="v${version}"
          if [ -n "$REQUESTED_TAG" ]; then
            requested="$REQUESTED_TAG"
            tag="v${requested#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${canonical_tag}"
          fi
          [ "$tag" = "$canonical_tag" ] || {
            echo "::error::release tag '$tag' does not match VERSION '$canonical_tag'"; exit 1;
          }
          source_sha="$(git rev-parse HEAD)"
          # A push to main is the release trigger. The tag is created by the
          # release job only after every build/verification gate is green.
          # If VERSION still names an older already-tagged commit, this merge
          # did not change the version: skip the expensive matrix instead of
          # rebuilding the same release or overwriting published assets.
          skip="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            [ "${GITHUB_REF_NAME}" = "main" ] || {
              echo "::error::release pushes are only accepted on main"; exit 1;
            }
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              tagged_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
              if [ "$tagged_commit" = "$source_sha" ]; then
                echo "::notice::tag $tag already names this commit; release is already handled"
              else
                echo "::notice::VERSION $tag is unchanged from ${tagged_commit}; skipping this main merge"
                skip="true"
              fi
            fi
          fi
          # The release deliverable is the S10+ image that runs on the phone.
          # workflow_dispatch may explicitly request g7power as well.
          devs="$REQUESTED_DEVICES"
          [ -n "$devs" ] || devs="s10plus"
          # Only g7power + s10plus are supported for now.
          allowed=" g7power s10plus "
          filtered=""
          for d in $devs; do
            case "$allowed" in
              *" $d "*) filtered="${filtered} ${d}" ;;
              *) echo "::warning::ignoring unsupported device '${d}' (supported: g7power s10plus)" ;;
            esac
          done
          filtered="${filtered# }"
          [ -n "${filtered}" ] || { echo "::error::no supported device requested"; exit 1; }
          json="$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$filtered")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "devices=${json}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "Release tag : ${tag}"
          echo "Skip build  : ${skip}"
          echo "Source SHA  : ${source_sha}"
          echo "Devices     : ${json}"

  build:
    name: build ${{ matrix.device }}
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.prepare.outputs.devices) }}
    env:
      NUXEL_DEVICE: ${{ matrix.device }}
      # S10+ board revision for the base-DTB + board-DTBO merge (fdtoverlay).
      # Rev 26 / EUR OPEN is the merged board DTB in the locally flashed image.
      # Ignored by the g7power job.
      NUXEL_S10PLUS_BOARD_REV: '26'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install build dependencies
        run: |
          # ffmpeg is REQUIRED: images/mkrootfs.sh -> tools/build-nuxel-boot-theme.sh
          # extracts the Plymouth boot-animation frames with it. Without ffmpeg
          # the theme step silently degrades and the rootfs/release ships without
          # the ~50 MB splash (the exact local-vs-CI 60 MB vs 20 MB gap).
          sudo apt-get update
          # libc6-dev-arm64-cross is REQUIRED and is NOT implied by
          # gcc-aarch64-linux-gnu with --no-install-recommends: without the
          # target libc headers a cross compiler still finds the HOST
          # /usr/include and dies on a static link with
          #   "bits/wordsize.h: No such file or directory"
          # which is exactly what the A25 initramfs build (nuxel-console,
          # nuxel-verify, nuxel-hwprobe are statically linked aarch64 binaries)
          # hit on the first v0.4.0-alpha run.
          # python3-pytest is required by the PWNAGE-30000 acceptance
          # step below; without it the release dies with "No module named pytest".
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio gzip xz-utils zstd lz4 zip unzip rsync file kmod \
            python3 python3-pip python3-pytest git curl wget ca-certificates \
            device-tree-compiler e2fsprogs fakeroot dosfstools \
            android-sdk-libsparse-utils uuid-runtime \
            ffmpeg

      - name: Install arm64 emulation + podman (s10plus)
        if: matrix.device == 's10plus'
        run: |
          # The S10+ rootfs is a Fedora 43 ARM64 phone userspace built by
          # images/s10plus/build-phone-rootfs-fedora.sh, which runs
          #   podman run --platform linux/arm64 fedora:43 ...
          # On the x86_64 runner that needs podman + qemu binfmt so the arm64
          # image can execute (DNF resolves/installs real aarch64 RPMs).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            podman qemu-user-static binfmt-support
          podman --version
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -i aarch64 \
            || echo "::warning::no aarch64 binfmt handler visible; arm64 podman run may fail"

      - name: Populate single-source PWA assets
        run: |
          # tools/dedupe-assets.sh is committed executable; make it explicit so
          # an archive that dropped the bit still runs the real asset population.
          chmod +x tools/dedupe-assets.sh tools/verify-pwa-assets.sh
          make assets

      - name: Build shared initramfs (g7power)
        if: matrix.device == 'g7power'
        run: |
          # The shared (device-agnostic) initramfs is the g7power chain's payload.
          # The S10+ does NOT use it: its initramfs is built from repo sources by
          # tools/s10plus/build-a25-initramfs.sh and embedded in the kernel Image,
          # because this bootloader never executes an external ramdisk.
          bash images/build.sh --initramfs-only

      - name: Build kernel (${{ matrix.device }})
        run: |
          case "${{ matrix.device }}" in
            g7power) bash kernel/g7power/build-kernel.sh --clone ;;
            s10plus) bash kernel/s10plus/build-kernel.sh --clone ;;
            *) echo "::error::unsupported device ${{ matrix.device }}"; exit 1 ;;
          esac

      - name: Build lk2nd bootloader (g7power)
        if: matrix.device == 'g7power'
        run: bash boot/g7power/lk2nd/build-lk2nd.sh

      - name: Build images (${{ matrix.device }})
        run: |
          case "${{ matrix.device }}" in
            g7power)
              bash images/g7power/build.sh --device g7power
              ;;
            s10plus)
              # 1) THE A25 BOOT IMAGE — the boot image currently flashed on the
              #    handset. repo-source initramfs -> RAW arm64 kernel Image with
              #    the archive EMBEDDED (CONFIG_INITRAMFS_SOURCE) -> legacy v1
              #    boot.img with the merged board DTB. The script runs
              #    tools/s10plus/verify-a25-boot.py fail-closed before it exits 0.
              bash images/s10plus/build-a25-boot.sh
              # 2) The real Fedora 43 ARM64 phone userspace written to USERDATA.
              #    Inside the arm64 container this also COMPILES the current A34
              #    TOUCHDOWN userspace from repo sources (display bridge, PWA
              #    host, button manager, libinput shim, snapshot tool), so CI
              #    produces exactly the runtime the handset is running rather
              #    than copying a developer-only build/out/s10plus/a32 tree.
              NUXEL_S10PLUS_OUTPUT="$PWD/build/out/s10plus/nuxel-beyond2lte-rootfs-fedora-phone.img" \
                bash images/s10plus/build.sh --device s10plus --phone-rootfs
              ;;
            *) echo "::error::unsupported device ${{ matrix.device }}"; exit 1 ;;
          esac

      - name: Build and verify the live userspace payload (s10plus)
        if: matrix.device == 's10plus'
        run: |
          # This is the hash-manifested userspace delta used for live
          # deployment. It is generated from the exact checkout being built so
          # the release contains the same PWA/bridge bytes that are running on
          # the phone, plus the current system-monitor and navigation fixes.
          payload="$PWD/build/out/s10plus/nuxel-${{ needs.prepare.outputs.tag }}-live-userspace.tar.gz"
          python3 tools/s10plus/a43/package-live.py "$payload"
          python3 tools/s10plus/a43/verify-live.py "$payload"
          python3 tools/s10plus/a43/test-a43-source.py

      - name: Run current S10+ userspace regression tests
        if: matrix.device == 's10plus'
        run: |
          # These drive the real shipped sources (A34 FSM, SYN_REPORT touch
          # translation, QS gesture, A33 MT parser, A40 metrics, A44 launcher
          # contracts) without a phone attached. The libinput suite consumes a
          # HOST-built selftest binary; build it first so a fresh CI checkout
          # does not depend on local build output.
          bash tools/s10plus/a33/build-libinput-shim.sh --selftest
          bash tools/s10plus/a34/tests/run-a34-tests.sh
          bash tools/s10plus/a33/tests/run-touch-tests.sh --quick
          bash tools/s10plus/a40/tests/run-a40-tests.sh
          # A77: the three lockscreen indicators (charging / PC / Live Console)
          # are the surface that regressed.  Gate BOTH truth providers (Python
          # bridge + native C host) and the shipped DOM layer, so a stale
          # "pc_connected" after a physical detach can never ship again.
          python3 services/nuxel-bridge/test-system-indicators.py
          python3 tools/s10plus/a45/test-lockscreen-indicators.py
          node tools/s10plus/a45/test-lockscreen-indicators.js

      - name: PWNAGE-30000 app-suite regression tests
        if: matrix.device == 's10plus'
        run: |
          # Offline acceptance for the PWA application-suite changes: the
          # bridge persistence/mail transports, the WAV encoder, the widget
          # framework/theme/haptics clients, and the static PWA DOM wiring.
          python3 -m pytest tests/pwnage30000 -q
          python3 tools/s10plus/a33/tests/test-core-apps.py --no-runtime

      - name: Verify artifacts (${{ matrix.device }})
        run: bash tools/verify-artifacts.sh --device "${{ matrix.device }}"

      - name: Package device artifact
        run: |
          bash tools/package-release.sh \
            --version "${{ needs.prepare.outputs.tag }}" \
            --device "${{ matrix.device }}" \
            --out dist
          # keep only this device's tarball for the per-device artifact
          find dist -maxdepth 1 -type f -name '*.tar.gz' \
            ! -name "nuxel-*-${{ matrix.device }}.tar.gz" -delete
          test -n "$(find dist -maxdepth 1 -type f -name "nuxel-*-${{ matrix.device }}.tar.gz")" \
            || { echo "::error::no release tarball produced for ${{ matrix.device }}"; exit 1; }

      - name: Upload device artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxel-${{ matrix.device }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: [prepare, build]
    # Only publish from a fully successful build — never from a red/partial one.
    if: ${{ needs.build.result == 'success' && needs.prepare.outputs.skip != 'true' && (github.event_name == 'push' || inputs.publish == true) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Collect device artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nuxel-*
          merge-multiple: true
          path: dist

      - name: Verify the captured installed phone image
        run: |
          # The release must ship the EXACT BOOT image installed on the owner's
          # handset, not only an image rebuilt from the same sources. The
          # capture under release/s10plus/ is verified fail-closed here:
          # decompressed SHA-256/bytes, v1 ANDROID! header, raw arm64 kernel,
          # kernel/ramdisk hashes and the recorded full-partition readback.
          python3 tools/release/verify-installed-image.py --json

      - name: Assemble release assets (checksums + notes)
        run: |
          ls -lh dist || true
          # Publish the captured installed image + its provenance manifest
          # alongside the CI-built device archives.
          cp release/s10plus/nuxel-installed-s10plus-boot.img.gz dist/
          cp release/s10plus/nuxel-installed-s10plus-userspace-files.txt.gz dist/
          cp release/s10plus/INSTALLED-IMAGES.json dist/
          bash tools/package-release.sh \
            --version "${{ needs.prepare.outputs.tag }}" \
            --from-assets --out dist

      - name: Verify every expected device shipped
        run: |
          expected="$(echo '${{ needs.prepare.outputs.devices }}' | tr -d '[]"' | tr ',' ' ')"
          missing=0
          for dev in $expected; do
            if ! ls dist/nuxel-*-"${dev}".tar.gz >/dev/null 2>&1; then
              echo "::error::missing release archive for device '${dev}'"
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ] || exit 1
          echo "All expected devices present: ${expected}"

      - name: Create annotated release tag
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          sha="${{ needs.prepare.outputs.source_sha }}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha" ] || {
              echo "::error::tag $tag already points at $(git rev-parse "refs/tags/$tag^{commit}"), not the built commit $sha"; exit 1;
            }
            echo "Tag $tag already exists on the built commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Nuxel $tag" "$sha"
            git push origin "refs/tags/$tag"
            echo "Created and pushed annotated tag $tag"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          sha="${{ needs.prepare.outputs.source_sha }}"
          [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha" ] || {
            echo "::error::tag no longer matches the built source commit"; exit 1;
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists; leaving published assets untouched"
            echo "### Release ${tag} already exists" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" \
            dist/*.tar.gz \
            dist/*.img.gz \
            dist/INSTALLED-IMAGES.json \
            dist/*.txt.gz \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --latest \
            --title "Nuxel ${tag}" \
            --notes-file dist/RELEASE-NOTES.md
          echo "### Published ${tag}" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json url -q .url >> "$GITHUB_STEP_SUMMARY" || true
