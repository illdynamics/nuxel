<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="nl.nuxel.Radio1"/>
    <allow send_destination="nl.nuxel.Radio1"/>
  </policy>
  <policy user="nuxel-bridge">
    <allow send_destination="nl.nuxel.Radio1" send_interface="nl.nuxel.Radio1"/>
    <allow send_destination="nl.nuxel.Radio1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
