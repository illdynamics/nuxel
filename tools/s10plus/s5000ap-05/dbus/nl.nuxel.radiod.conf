<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  nuxel-radiod system-bus policy. Version 1.

  Owns nl.nuxel.Radio1. Only root may own the well-known name. Nobody may
  OWN the name except root; clients can only CALL via the polkit-checked
  methods. Default-deny for everything else (no eavesdrop).
-->
<busconfig>
  <policy user="root">
    <allow own="nl.nuxel.Radio1"/>
    <allow send_destination="nl.nuxel.Radio1"/>
  </policy>
  <policy context="default">
    <deny own="nl.nuxel.Radio1"/>
    <allow send_destination="nl.nuxel.Radio1"/>
    <deny send_destination="nl.nuxel.Radio1" send_type="method_call"
          send_member="SetRadioEnabled"/>
    <deny send_destination="nl.nuxel.Radio1" send_type="method_call"
          send_member="CreateBearer"/>
    <deny send_destination="nl.nuxel.Radio1" send_type="method_call"
          send_member="DeleteBearer"/>
  </policy>
</busconfig>
