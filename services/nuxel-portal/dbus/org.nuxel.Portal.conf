<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Nuxel Portal D-Bus Security Policy -->
  <!-- Mediates ALL hardware access through user-consent dialogs -->
  <!-- The portal runs as the graphical 'nuxel' user (uid 1000) so it can
       forward consent requests to org.nuxel.PhoshAgent on the session bus
       (dbus-broker user scope rejects cross-uid connections; root cannot
       reach the session bus). 'root' remains allowed for older deployments.
       Verified 2026-08-19, bg-09. -->
  <policy user="nuxel">
    <allow own="org.nuxel.Portal"/>
    <allow send_destination="org.nuxel.Portal"/>
  </policy>

  <policy user="root">
    <allow own="org.nuxel.Portal"/>
    <allow send_destination="org.nuxel.Portal"/>
  </policy>

  <!-- nuxel-bridge needs full access for permission checks -->
  <policy user="nuxel-bridge">
    <allow send_destination="org.nuxel.Portal"/>
    <allow receive_sender="org.nuxel.Portal"/>
  </policy>

  <!-- nuxel-notifications needs notification portal access -->
  <policy user="nuxel-notifications">
    <allow send_destination="org.nuxel.Portal"/>
  </policy>

  <!-- All other users: can call portal methods (consent dialogs appear) -->
  <policy context="default">
    <allow send_destination="org.nuxel.Portal"
           send_interface="org.nuxel.Portal"/>
    <allow receive_sender="org.nuxel.Portal"/>
  </policy>

</busconfig>
