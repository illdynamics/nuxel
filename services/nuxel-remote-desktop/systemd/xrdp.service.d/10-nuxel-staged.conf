# Nuxel A88 - XRDP reads the config the XRDP app generates.
#
# The XRDP app (through nuxel-bridge) regenerates xrdp.ini on every Start: the
# trusted WLAN bind address, TLS material and the libvnc loopback mirror.  The
# bridge is sandboxed with ProtectSystem=full, so it cannot rewrite /etc as the
# root daemon's file.  The controller therefore publishes the identical bytes
# (root-owned 0644) at /var/lib/nuxel/remote-desktop/xrdp.ini, and systemd hands
# that file to this root-only unit as a credential.  Nothing else about the
# xrdp unit changes; PAM authentication still happens through xrdp-sesman.
[Service]
LoadCredential=xrdp.ini:/var/lib/nuxel/remote-desktop/xrdp.ini
