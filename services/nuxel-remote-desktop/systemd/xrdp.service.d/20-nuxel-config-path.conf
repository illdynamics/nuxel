# Nuxel A88 - point the xrdp listener at the credential-managed config.
#
# `xrdp -c <file>` is the supported config-path option (xrdp --help on the
# handset: "-c, --config  specify new path to xrdp.ini").  %d is the unit's
# $CREDENTIALS_DIRECTORY.  The empty ExecStart= first resets the packaged
# command so only this one runs.
[Service]
ExecStart=
ExecStart=/usr/bin/xrdp -c %d/xrdp.ini $XRDP_OPTIONS --nodaemon
