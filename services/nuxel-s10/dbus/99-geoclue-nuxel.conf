<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Nuxel S10+: the stock geoclue policy owns the name but drops the
       method replies for default clients on this image, so every CreateClient
       call times out.  Allow the Manager/Client/Properties/Introspectable
       calls explicitly; the service remains the only owner. -->
  <policy user="geoclue">
    <allow own="org.freedesktop.GeoClue2"/>
    <allow send_destination="org.freedesktop.GeoClue2"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.GeoClue2"
           send_interface="org.freedesktop.GeoClue2.Manager"/>
    <allow send_destination="org.freedesktop.GeoClue2"
           send_interface="org.freedesktop.GeoClue2.Client"/>
    <allow send_destination="org.freedesktop.GeoClue2"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.freedesktop.GeoClue2"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.GeoClue2"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
