# Nuxel S10+ ALSA default: RDMA0's DSP task does not advance; RDMA1 runs at
# 44.1 kHz.  Keep control access on card 0 and send default playback to RDMA1.
# The plug layer lets 48 kHz consumers open the 44.1 kHz hardware PCM.
pcm.!default {
    type plug
    slave.pcm {
        type hw
        card 0
        device 1
    }
}

ctl.!default {
    type hw
    card 0
}
