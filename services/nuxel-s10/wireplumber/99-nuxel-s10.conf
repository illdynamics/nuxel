# WirePlumber policy for the S10+ RDMA1 sink.
# The static sink is created by /etc/pipewire/pipewire.conf.d/50-nuxel-s10-alsa.conf
# as node.name=alsa_output.hw_0_1.  Match by the stable node-name prefix so a
# PipeWire/WirePlumber rename cannot silently drop the policy.  Never
# suspend/pause the ALSA node: on this vendor 4.14 kernel a later amixer open
# can block in rpm_resume.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        node.suspend-on-idle = false
        node.always-process = true
        api.alsa.period-size = 1024
        api.alsa.headroom = 0
      }
    }
  }
]
