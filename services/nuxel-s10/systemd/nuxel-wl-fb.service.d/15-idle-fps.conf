# PWNAGE-54000: cap the software scanout at 20 fps.  The panel is refreshed
# from a full wlr-screencopy every frame; 30 fps kept two CPU cores busy even
# when the UI was static and contributed to the 20-30% idle load.  20 fps
# preserves motion smoothness while cutting that work by one fifth.
#
# PWNAGE-96000 measured the 30 FPS candidate with a full-frame GTK animation:
#   fps_1s=25-26, frame_p50_ms=33-35, frame_p95_ms=49-51 (>33.3 ms budget),
#   capture_avg=16, compare_avg=5, blit_avg=5, pan_avg=8-9 ms (~34-35 ms work).
# The software screencopy/compare/blit/pan route has no headroom for a sustained
# 30 FPS present every 33.3 ms, so 30 FPS is NOT claimed and 20 FPS remains the
# active safe target.  Live A/B (no service restart):
#   printf "fps 30\n" > /run/nuxel-wl-fb.cmd   # candidate
#   printf "fps 20\n" > /run/nuxel-wl-fb.cmd   # safe rollback
# True VSync is not claimed: the decon ioctl handles FBIO_WAITFORVSYNC, but
# decon_wait_for_vsync() returns immediately unless the panel runs DECON_HW_TRIG;
# this command-mode panel commits through FBIOPAN_DISPLAY.
[Service]
Environment=NUXEL_TARGET_FPS=20
