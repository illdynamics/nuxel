# Nuxel S10+ (v0.8.3-beta): ZeroTier's control plane drops to the
# zerotier-one service user before opening the TUN device.  devtmpfs creates
# /dev/net/tun as root:root 0600, so the daemon otherwise reports EACCES and
# never configures the joined network.  Grant only the service group access;
# the device is never made world-writable.
[Service]
ExecStartPre=+/bin/chgrp zerotier-one /dev/net/tun
ExecStartPre=+/bin/chmod 0660 /dev/net/tun
