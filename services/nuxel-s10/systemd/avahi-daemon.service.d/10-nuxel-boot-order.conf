# PWNAGE-91000: avahi must not put network-online.target on the boot critical
# path.  The historical EACCES failure happened when avahi was D-Bus activated
# before NetworkManager configured wlan0; a completed "network is online"
# transaction is not required for mDNS.  Avahi joins interfaces via netlink as
# addresses appear, and the bounded Restart=on-failure retries a transient
# early failure.  Ordering after NetworkManager/wpa_supplicant is sufficient
# and keeps the interface enumeration deterministic without pulling in
# NetworkManager-wait-online (measured 5.774 s on boot 5ab43e24).
[Unit]
After=NetworkManager.service wpa_supplicant.service
# Deliberately no Wants=network-online.target / After=network-online.target.

[Service]
Restart=on-failure
RestartSec=3
