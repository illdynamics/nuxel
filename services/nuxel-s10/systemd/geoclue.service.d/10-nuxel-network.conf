# The S10+ Samsung kernel denies AF_INET socket creation to processes without
# CAP_NET_RAW (verified: uid 999 socket(AF_INET,SOCK_DGRAM) -> EACCES; the same
# call with cap_net_raw succeeds).  GeoClue needs DNS/TLS only for its enabled
# Wi-Fi/IP fallback; no other capability is granted.
[Service]
CapabilityBoundingSet=CAP_NET_RAW
AmbientCapabilities=CAP_NET_RAW
