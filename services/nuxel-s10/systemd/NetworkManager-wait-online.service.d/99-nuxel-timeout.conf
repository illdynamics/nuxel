# Wi-Fi autoconnect is handled by nuxel-wifi.service; do not let dnf's online
# target hold boot for the stock 60 s (previously overridden to 30 s).  This is
# a bound, not a claim: if the link is present it is reported immediately.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -s -q --timeout=15
