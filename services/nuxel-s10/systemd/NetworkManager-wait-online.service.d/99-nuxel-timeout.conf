# Wi-Fi autoconnect is handled by nuxel-wifi.service; nothing in the Nuxel
# launcher chain needs network-online.target.  The stock 60 s wait (previously
# overridden to 15 s) still held the tail of boot for a link that is optional
# for the UI.  Three seconds is enough to report an already-present link and is
# a hard bound when the handset is offline.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -s -q --timeout=3
