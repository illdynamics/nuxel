# Nuxel — current home LAN SSH allowlist (owner network, 2026-10-29).
#
# The 26000 Tri-Link policy allowed only the old 10.20.30.0/24 and
# 10.15.19.0/24 Nuxel subnets.  After the owner moved to a new router the phone
# received 192.168.178.0/24 and every key was refused before authentication.
# sshd appends AllowUsers entries from all drop-ins, so this file extends the
# existing allowlist rather than replacing it.  Public-key-only authentication
# remains enforced by 60-nuxel-tri-link.conf.
AllowUsers nuxel@192.168.178.0/24 root@192.168.178.0/24
