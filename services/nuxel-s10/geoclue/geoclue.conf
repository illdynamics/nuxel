# Nuxel S10+ geoclue policy.
# The BCM4773 GNSS sensor speaks Broadcom BBD/LHD, not NMEA: a stock gpsd on
# /dev/ttyBCM cannot produce a fix.  Use Wi-Fi + IP (network) location only;
# never claim a GNSS fix.  Packages that ship GNSS/3G sources keep them off.
[agent]
whitelist=geoclue-demo-agent;gnome-shell;io.elementary.desktop.agent-geoclue2;sm.puri.Phosh;lipstick

[ip]
enable=true
method=ichnaea

[wifi]
enable=true
submit-data=false

[network-nmea]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false

[compass]
enable=false

[static-source]
enable=false

[gnome-datetime-panel]
allowed=true
system=true
users=

[gnome-color-panel]
allowed=true
system=true
users=

[org.gnome.Shell]
allowed=true
system=true
users=

[io.elementary.desktop.agent-geoclue2]
allowed=true
system=true
users=

[sm.puri.Phosh]
allowed=true
system=true
users=

[epiphany]
allowed=true
system=false
users=

[firefox]
allowed=true
system=false
users=

[lipstick]
allowed=true
system=true
users=

[geoclue-demo-agent]
allowed=true
system=true
users=

[geoclue-where-am-i]
allowed=true
system=true
users=
