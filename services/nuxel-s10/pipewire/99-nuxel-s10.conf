# Match the verified ABOX/RDMA1 rate (48 kHz) and keep the graph cheap on software CPU.
# PWNAGE-40000: the staged pwnage36000 bundle used to reinstall a lower-rate
# copy here at boot, silently undoing the measured 48 kHz requirement.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 1024
    default.clock.min-quantum = 256
    default.clock.max-quantum = 2048
}
