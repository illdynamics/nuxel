<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Session-bus policy for the Nuxel in-app consent surface.
       Installed to /etc/dbus-1/session.d/.  The portal (uid nuxel) and root
       own the prompt; ordinary apps must not be able to pop consent cards or
       spoof a reply on behalf of the user. -->
  <policy user="nuxel">
    <allow own="org.nuxel.PhoshAgent"/>
    <allow send_destination="org.nuxel.PhoshAgent"/>
    <allow receive_sender="org.nuxel.PhoshAgent"/>
  </policy>
  <policy user="nuxel">
    <!-- Installed in BOTH /etc/dbus-1/session.d and /etc/dbus-1/system.d:
         the agent (uid 1000) owns the name on the session bus AND on the
         system bus, so the root HTTP bridge can list/answer prompts over a
         principal that the session bus accepts. -->
    <allow own="org.nuxel.PhoshAgent"/>
    <allow send_destination="org.nuxel.PhoshAgent"/>
    <allow receive_sender="org.nuxel.PhoshAgent"/>
  </policy>
  <policy user="root">
    <allow own="org.nuxel.PhoshAgent"/>
    <allow send_destination="org.nuxel.PhoshAgent"/>
    <allow receive_sender="org.nuxel.PhoshAgent"/>
  </policy>
  <policy context="default">
    <deny own="org.nuxel.PhoshAgent"/>
    <!-- No blanket deny on send_destination: the agent itself must be able to
         call its own methods, and dbus rejects a policy that would leave the
         connection unable to send back the reply (measured: the whole bus
         dropped our Hello with NoReply).  RequestPermission is gated in code
         to the broker uid plus a valid (app, capability) pair. -->
    <allow send_destination="org.nuxel.PhoshAgent"/>
    <allow receive_sender="org.nuxel.PhoshAgent"/>
  </policy>
</busconfig>
