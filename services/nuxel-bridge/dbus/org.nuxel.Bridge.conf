<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Nuxel Bridge D-Bus Security Policy
  
       This policy defines who can own the bus name and who can communicate
       with the nuxel-bridge service.
       
       Architecture:
         PWA (Flatpak sandbox) → xdg-desktop-portal → nuxel-bridge → ModemManager
         
       Security principles:
       - Only root can own the org.nuxel.Bridge bus name
       - Members of the 'nuxel' group can send to and receive from the bridge
       - Apps running as the 'nuxel' user have full access
       - Default policy denies everything
       - No unrestricted system-bus exposure
       - No raw modem access or AT commands pass through
  -->
  
  <!-- Root user: full control -->
  <policy user="root">
    <allow own="org.nuxel.Bridge"/>
    <allow send_destination="org.nuxel.Bridge"/>
    <allow receive_sender="org.nuxel.Bridge"/>
    <allow send_interface="org.nuxel.Bridge"/>
    <allow receive_interface="org.nuxel.Bridge"/>
    <allow send_path="/org/nuxel/Bridge"/>
    <allow receive_path="/org/nuxel/Bridge"/>
    <allow own="org.freedesktop.DBus"/>
    <allow send_destination="org.freedesktop.DBus"/>
  </policy>
  <policy user="nuxel-bridge">
    <allow own="org.nuxel.Bridge"/>
    <allow send_destination="org.nuxel.Bridge"/>
    <allow receive_sender="org.nuxel.Bridge"/>
    <allow send_interface="org.nuxel.Bridge"/>
    <allow receive_interface="org.nuxel.Bridge"/>
    <allow send_path="/org/nuxel/Bridge"/>
    <allow receive_path="/org/nuxel/Bridge"/>
  </policy>

  
  <!-- nuxel group: can communicate with bridge -->
  <policy group="nuxel">
    <allow send_destination="org.nuxel.Bridge"/>
    <allow receive_sender="org.nuxel.Bridge"/>
    <allow send_interface="org.nuxel.Bridge"/>
    <allow receive_interface="org.nuxel.Bridge"/>
    <allow send_path="/org/nuxel/Bridge"/>
    <allow receive_path="/org/nuxel/Bridge"/>
    
    <!-- Bridge can talk back to valid clients -->
    <allow send_destination="org.nuxel.*"/>
    <allow receive_sender="org.nuxel.*"/>
  </policy>
  
  <!-- Flatpak apps with proper sandboxing -->
  <policy group="flatpak">
    <allow send_destination="org.nuxel.Bridge"/>
    <allow receive_sender="org.nuxel.Bridge"/>
    <allow send_interface="org.nuxel.Bridge"/>
    <allow receive_interface="org.nuxel.Bridge"/>
    <allow send_path="/org/nuxel/Bridge"/>
    <allow receive_path="/org/nuxel/Bridge"/>
  </policy>
  
  <!-- Default: deny everything -->
  <policy context="default">
    <deny own="org.nuxel.Bridge"/>
    <deny send_destination="org.nuxel.Bridge"/>
    <!-- Do not block ordinary method calls/replies from the bridge to other
         system services (GeoClue etc.).  Only broadcast signals from the
         bridge are denied to unprivileged users; its own path/interface
         remains fully protected by the deny rules below. -->
    <deny receive_sender="org.nuxel.Bridge" receive_type="signal"/>
    <deny send_interface="org.nuxel.Bridge"/>
    <deny receive_interface="org.nuxel.Bridge"/>
    <deny send_path="/org/nuxel/Bridge"/>
    <deny receive_path="/org/nuxel/Bridge"/>
  </policy>
  
  <!-- Standard D-Bus limitations -->
  <limit name="max_incoming_bytes">100000000</limit>
  <limit name="max_incoming_unix_fds">8</limit>
  <limit name="max_outgoing_bytes">100000000</limit>
  <limit name="max_outgoing_unix_fds">8</limit>
  <limit name="max_message_size">10000000</limit>
  <limit name="service_start_timeout">120000</limit>
  <limit name="auth_timeout">240000</limit>
  <limit name="max_completed_connections">100000</limit>
  <limit name="max_incomplete_connections">10000</limit>
  <limit name="max_connections_per_user">10000</limit>
  <limit name="max_pending_service_starts">100</limit>
  <limit name="max_names_per_connection">50000</limit>
  <limit name="max_match_rules_per_connection">500</limit>
  <limit name="max_replies_per_connection">50000</limit>
  
</busconfig>
