<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- SYSTEM-bus policy for the Radio1 bridge (nuxel-radio-bridge).
       Installed to /etc/dbus-1/system.d/.  The bridge runs as root and owns
       nl.nuxel.Radio1Bridge (radiod already owns nl.nuxel.Radio1 on the
       system bus with its small mobile-only vtable); the HTTP bridge (nuxel-bridge) may call it so PWA
       callers reach the radio.  Session-user apps on the per-user bus cannot
       reach the system bus, so this does not widen the app surface.  Radio1's
       own vtable still checks the real caller's EUID for private methods. -->
  <policy user="root">
    <allow own="nl.nuxel.Radio1Bridge"/>
    <allow send_destination="nl.nuxel.Radio1Bridge"/>
    <allow receive_sender="nl.nuxel.Radio1Bridge"/>
  </policy>
  <policy user="nuxel-bridge">
    <allow send_destination="nl.nuxel.Radio1Bridge"/>
    <allow receive_sender="nl.nuxel.Radio1Bridge"/>
  </policy>
  <!-- nuxel-dialer also runs as the session user: allow it to query voice
       status and hang up.  Radio1 checks the caller's EUID per method. -->
  <policy user="nuxel">
    <allow send_destination="nl.nuxel.Radio1Bridge"/>
    <allow receive_sender="nl.nuxel.Radio1Bridge"/>
  </policy>
  <policy context="default">
    <deny own="nl.nuxel.Radio1Bridge"/>
    <deny send_destination="nl.nuxel.Radio1Bridge"/>
    <deny receive_sender="nl.nuxel.Radio1Bridge"/>
  </policy>
</busconfig>
