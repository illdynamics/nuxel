# Nuxel device configuration — Google Pixel 10 Pro XL (mustang)
# Kernel module autoloading + hardware paths.
#
# Canonical source for the modprobe config shipped by device-google-mustang
# (device/google-pixel-10-pro-xl/APKBUILD installs THIS file; it is no longer
# generated inline).
#
# NOTE: every module below except ufshcd/dwc3 lives in the PRIVATE Google
# vendor kernel tree (android-gs-mustang-6.12) or needs a downstream patch.
# The public GKI android16-6.12 scaffold build does NOT provide them, so this
# file only has effect once the vendor kernel is used. See
# kernel/google-pixel-10-pro-xl/README-toolchain.md.

# GPU (Imagination PowerVR DXT-72-2304)
powervr

# Display (Samsung AMB655X LTPO panel)
drm_kms_helper
panel_samsung_amb655x

# Touch (Samsung S6SY791)
samsung_s6sy791

# Modem (Samsung Exynos 5500, MHI/PCIe)
mhi
mhi_pci_generic
mhi_wwan_ctrl
mhi_samsung

# WiFi / BT (Broadcom BCM4390)
brcmfmac
btbcm
hci_uart

# Audio (Cirrus Logic CS42L43 codec + CS35L45 amp)
snd_soc_cs42l43
snd_soc_cs35l45

# Sensors
bmi270_i2c
st_lsm6dsv_i2c

# PMIC (Maxim)
max77729
max77826

# Charger / fuel gauge
bq2597x_charger
max1720x_battery

# Storage (UFS 4.0) — mainline
ufshcd
ufshcd_plat
