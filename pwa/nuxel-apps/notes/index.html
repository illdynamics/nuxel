<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="nuxel-app-id" content="org.nuxel.Notes">
    <link rel="manifest" href="manifest.json">
    <title>Nuxel Notes</title>
    <link rel="stylesheet" href="css/notes.css">
</head>
<body>
    <div class="top-bar">
        <button id="menu-btn" class="icon-btn">☰</button>
        <h1>Notes</h1>
        <button id="new-note-btn" class="icon-btn">+</button>
    </div>

    <div id="notes-list" class="notes-list"></div>

    <div id="note-editor" class="note-editor hidden">
        <div class="editor-topbar">
            <button id="editor-back" class="icon-btn">←</button>
            <button id="editor-save" class="btn-primary">Done</button>
        </div>
        <input type="text" id="note-title" class="note-title-input" placeholder="Title">
        <div class="note-toolbar" id="note-toolbar">
            <button class="tool-btn" data-cmd="bold"><b>B</b></button>
            <button class="tool-btn" data-cmd="italic"><i>I</i></button>
            <button class="tool-btn" data-cmd="heading">H</button>
            <button class="tool-btn" data-cmd="list">•</button>
            <button class="tool-btn" data-cmd="code">&lt;/&gt;</button>
        </div>
        <textarea id="note-body" class="note-body-input" placeholder="Start writing..." spellcheck="true"></textarea>
        <div class="note-meta" id="note-meta"></div>
    </div>

    <script type="module" src="../../nuxel-common/bridge.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/notes-io.js"></script>
</body>
</html>
