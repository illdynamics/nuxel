<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="nuxel-app-id" content="org.nuxel.RootControl">
<link rel="manifest" href="manifest.json">
<title>Root &amp; Sudo</title>
<link rel="stylesheet" href="css/rootcontrol.css">
</head>
<body>
<header class="hdr">
  <h1>Root &amp; Sudo</h1>
  <span id="source-badge" class="badge">state: probing…</span>
  <span class="grow"></span>
  <button id="refresh" class="ghost">Refresh</button>
  <button id="close" class="ghost">Close</button>
</header>

<p class="banner">This page only <b>reads</b> privilege state. It cannot grant, revoke or use root,
  and it explicitly does <b>not</b> claim unbypassable root protection.</p>

<nav class="tabs">
  <button class="tab active" data-tab="overview">Overview</button>
  <button class="tab" data-tab="sudoers">sudoers</button>
  <button class="tab" data-tab="mechanism">Mechanism</button>
  <button class="tab" data-tab="claims">Enforcement claims</button>
  <button class="tab" data-tab="limits">What is not claimed</button>
</nav>

<main>
  <div id="source-note" class="note"></div>
  <section id="tab-overview" class="panel active"></section>
  <section id="tab-sudoers" class="panel"></section>
  <section id="tab-mechanism" class="panel"></section>
  <section id="tab-claims" class="panel"></section>
  <section id="tab-limits" class="panel"></section>
</main>

<div class="statusbar">
  <span id="sb-source">state source: —</span>
  <span id="sb-kernel">kernel: —</span>
  <span id="sb-mac">MAC: —</span>
</div>

<script type="module" src="../../nuxel-common/bridge.js"></script>
<script src="../_shared/sysinfo.js"></script>
<script src="js/privilege-model.js"></script>
<script src="js/rootcontrol.js"></script>
</body>
</html>
