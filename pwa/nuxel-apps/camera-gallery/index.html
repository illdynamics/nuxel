<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="nuxel-app-id" content="org.nuxel.Camera">
    <link rel="manifest" href="manifest.json">
    <title>Camera</title>
    <link rel="stylesheet" href="css/camera.css">
</head>
<body>
    <div id="camera-view" class="camera-view">
        <div class="camera-top-bar">
            <button id="switch-camera" class="cam-btn" aria-label="Switch camera">&#128260;</button>
            <span id="camera-active-indicator" class="active-indicator hidden" aria-live="polite">&#128247; camera active</span>
            <span class="cam-badge">Nuxel Camera</span>
        </div>

        <div id="viewfinder" class="viewfinder">
            <div id="viewfinder-placeholder" class="viewfinder-placeholder">
                <span class="viewfinder-icon">&#128247;</span>
                <p>Camera preview</p>
            </div>
            <video id="video-preview" class="video-preview hidden" autoplay playsinline></video>
            <div id="record-indicator" class="record-indicator hidden" aria-live="polite">
                <span class="record-dot"></span><span id="record-time">00:00</span>
            </div>
        </div>

        <div id="camera-status" class="camera-status hidden" aria-live="polite"></div>

        <div class="camera-status-actions">
            <button id="camera-retry" class="cam-btn" type="button" aria-label="Retry camera">Retry camera</button>
            <details id="camera-diagnostics" class="camera-diagnostics">
                <summary>Technical diagnostics</summary>
                <pre id="camera-diagnostics-body" class="camera-diagnostics-body">No camera diagnostics received yet.</pre>
            </details>
        </div>

        <div class="camera-bottom-bar">
            <button id="gallery-btn" class="cam-btn" aria-label="Open Photos">&#128444;&#65039;</button>
            <button id="capture-btn" class="capture-btn" aria-label="Capture"></button>
            <button id="switch-mode" class="cam-btn" aria-label="Switch photo/video">&#127909;</button>
        </div>
    </div>

    <p id="camera-toast" class="camera-toast hidden" aria-live="polite"></p>

    <script type="module" src="../../nuxel-common/bridge.js"></script>
    <script src="js/camera.js"></script>
</body>
</html>
