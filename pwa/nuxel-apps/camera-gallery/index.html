<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="nuxel-app-id" content="org.nuxel.Camera">
    <link rel="manifest" href="manifest.json">
    <title>Camera</title>
    <link rel="stylesheet" href="css/camera.css">
</head>
<body>
    <div id="camera-view" class="camera-view">
        <div class="camera-top-bar">
            <button id="switch-camera" class="cam-btn">🔄</button>
            <span id="camera-hdr" class="cam-badge">HDR</span>
        </div>
        
        <div id="viewfinder" class="viewfinder">
            <div class="viewfinder-placeholder">
                <span class="viewfinder-icon">📷</span>
                <p>Camera preview</p>
            </div>
            <video id="video-preview" class="video-preview hidden" autoplay playsinline></video>
        </div>

        <div class="camera-bottom-bar">
            <button id="gallery-btn" class="cam-btn">🖼️</button>
            <button id="capture-btn" class="capture-btn"></button>
            <button id="switch-mode" class="cam-btn">📹</button>
        </div>
    </div>

    <div id="gallery-view" class="gallery-view hidden">
        <div class="gallery-top-bar">
            <button id="gallery-back" class="cam-btn">←</button>
            <span>Gallery</span>
        </div>
        <div id="photo-grid" class="photo-grid"></div>
    </div>

    <script type="module" src="../../nuxel-common/bridge.js"></script>
    <script src="js/camera.js"></script>
</body>
</html>
