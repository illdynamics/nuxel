<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101725">
<meta name="nuxel-app-id" content="org.nuxel.Calculator">
<title>Nuxel Calculator</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/calculator.css">
</head>
<body>
<header class="top-bar">
  <h1>Calculator</h1>
  <button id="history-toggle" class="icon-btn" aria-expanded="false" title="History">🕘</button>
</header>

<main class="calc">
  <section class="display" aria-live="polite">
    <div id="expr" class="expr">&nbsp;</div>
    <div id="result" class="result">0</div>
    <div id="flags" class="flags">
      <span id="mem-flag" class="flag hidden">M</span>
      <span id="angle-flag" class="flag">DEG</span>
      <span id="mode-flag" class="flag">BASIC</span>
    </div>
  </section>

  <section class="pads">
    <div class="pad basic active" id="pad-basic">
      <button class="key fn" data-k="clear">AC</button>
      <button class="key fn" data-k="sign">±</button>
      <button class="key fn" data-k="percent">%</button>
      <button class="key op" data-k="div">÷</button>

      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key op" data-k="mul">×</button>

      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key op" data-k="sub">−</button>

      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key op" data-k="add">+</button>

      <button class="key" data-k="paren">( )</button>
      <button class="key" data-k="0">0</button>
      <button class="key" data-k="dot">.</button>
      <button class="key eq" data-k="equals">=</button>
    </div>

    <div class="pad sci" id="pad-sci">
      <button class="key fn" data-k="clear">AC</button>
      <button class="key fn" data-k="back">⌫</button>
      <button class="key fn" data-k="paren">( )</button>
      <button class="key fn" data-k="pi">π</button>
      <button class="key fn" data-k="const-e">e</button>

      <button class="key fn" data-k="sqrt">√</button>
      <button class="key fn" data-k="sqr">x²</button>
      <button class="key fn" data-k="pow">xʸ</button>
      <button class="key fn" data-k="inv">1/x</button>
      <button class="key fn" data-k="fact">n!</button>

      <button class="key fn" data-k="sin">sin</button>
      <button class="key fn" data-k="cos">cos</button>
      <button class="key fn" data-k="tan">tan</button>
      <button class="key fn" data-k="ln">ln</button>
      <button class="key fn" data-k="log">log</button>

      <button class="key mem" data-k="m-plus">M+</button>
      <button class="key mem" data-k="m-minus">M−</button>
      <button class="key mem" data-k="mr">MR</button>
      <button class="key mem" data-k="mc">MC</button>
      <button class="key fn" data-k="angle">DEG</button>
    </div>
  </section>

  <nav class="modes" role="tablist">
    <button class="mode active" data-pad="basic" role="tab">Basic</button>
    <button class="mode" data-pad="sci" role="tab">Scientific</button>
    <button class="mode" id="copy-btn" role="tab">Copy result</button>
  </nav>
</main>

<aside id="history" class="history hidden">
  <div class="history-head">
    <h2>History</h2>
    <div>
      <button id="history-clear" class="link">Clear</button>
      <button id="history-close" class="link">Close</button>
    </div>
  </div>
  <p class="hint">Stored on this device only (localStorage key <code>nuxel-calc-history</code>).
    Nothing is sent anywhere; Nuxel Calculator has no network capability.</p>
  <ul id="history-list"></ul>
</aside>

<p id="toast" class="toast hidden"></p>

<script type="module" src="../../nuxel-common/bridge.js"></script>
<script src="js/calculator.js"></script>
</body>
</html>
