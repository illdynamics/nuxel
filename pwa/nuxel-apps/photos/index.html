<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="nuxel-app-id" content="org.nuxel.Photos">
<title>Nuxel Gallery</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="../../nuxel-common/theme.css">
<link rel="stylesheet" href="css/photos.css?v=pwnage33000b">
</head>
<body>
<header class="top-bar">
  <h1>Gallery</h1>
  <span id="src-badge" class="badge">camera store: checking…</span>
</header>

<main>
  <section class="toolbar">
    <input id="search" type="text" placeholder="Search name, date or album">
    <select id="album">
      <option value="">All albums</option>
    </select>
    <button id="refresh">Refresh</button>
    <button id="export">Export index</button>
  </section>

  <div id="empty" class="empty">
    <h2>Gallery is empty</h2>
    <p>Nuxel Gallery browses real files in <code>~/Gallery</code>, <code>~/Pictures</code>,
      <code>~/Videos</code> and <code>~/DCIM</code>, plus real captures in the camera store.
      Nothing is bundled or generated: an empty folder stays empty.</p>
    <p class="li-sub" id="empty-detail">—</p>
  </div>

  <section id="grid" class="grid"></section>
</main>

<div id="viewer" class="viewer hidden">
  <div class="viewer-head">
    <button id="prev" class="icon-btn">‹</button>
    <span id="viewer-title" class="mono"></span>
    <button id="close" class="icon-btn">✕</button>
  </div>
  <div class="viewer-body"><div id="viewer-media"></div></div>
  <div class="viewer-meta">
    <pre id="viewer-info" class="state">—</pre>
    <div class="row">
      <button id="next-of">Next</button>
      <button id="delete">Delete capture</button>
    </div>
  </div>
  <div class="viewer-nav">
    <button id="prev-of">Previous</button>
    <button id="next-of2">Next</button>
  </div>
</div>

<p id="toast" class="toast hidden"></p>

<script src="../../nuxel-common/theme.js"></script>
<script src="../../nuxel-common/haptics.js"></script>
<script type="module" src="../../nuxel-common/bridge.js"></script>
<script src="js/photos.js?v=pwnage33000b"></script>
</body>
</html>
