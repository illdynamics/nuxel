<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="nuxel-app-id" content="org.nuxel.Terminal">
<title>Nuxel Terminal</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="terminal.css">
</head>
<body>
<header class="hdr">
  <span class="dot"></span><span id="title">nuxel terminal</span>
  <span class="grow"></span>
  <button id="clear" class="ghost">Clear</button>
  <button id="close" class="ghost">Close</button>
</header>
<pre id="screen" class="screen" tabindex="0"></pre>
<div id="osk" class="osk"></div>
<div id="notice" class="notice hidden"></div>
<!-- A34 TOUCHDOWN: the native terminal window is a TOP-LEVEL WebKit view, not an
     iframe.  It therefore needs the same host bridge and OSD overlay the launcher
     gets: without host-bridge.js window.NuxelHost was undefined, so Close and
     every on-screen key silently did nothing. -->
<script src="../../nuxel-home/js/host-bridge.js"></script>
<script src="../../nuxel-home/js/osd.js"></script>
<script src="terminal.js"></script>
</body>
</html>
