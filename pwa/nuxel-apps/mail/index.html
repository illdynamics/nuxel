<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="nuxel-app-id" content="org.nuxel.Mail">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <title>Nuxel Mail</title>
    <link rel="stylesheet" href="css/mail.css">
</head>
<body>
    <div id="app-root">
        <!-- Sidebar / Account List -->
        <div id="sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <h2>Accounts</h2>
                <button id="sidebar-close" class="icon-btn">✕</button>
            </div>
            <div id="account-list" class="account-list"></div>
            <button id="add-account-btn" class="btn-primary">Add Account</button>
        </div>

        <!-- Main view -->
        <div id="main-view" class="main-view">
            <!-- Top bar -->
            <div class="top-bar">
                <button id="menu-btn" class="icon-btn">☰</button>
                <h1 id="mail-title">Inbox</h1>
                <div class="top-bar-actions">
                    <button id="refresh-btn" class="icon-btn">↻</button>
                    <button id="compose-btn" class="icon-btn">✏️</button>
                </div>
            </div>

            <!-- Message list -->
            <div id="message-list" class="message-list">
                <div class="loading">Loading messages...</div>
            </div>

            <!-- Compose view -->
            <div id="compose-view" class="compose-view hidden">
                <div class="compose-header">
                    <button id="compose-back" class="icon-btn">←</button>
                    <h2>New Message</h2>
                    <button id="send-btn" class="btn-primary">Send</button>
                </div>
                <div class="compose-form">
                    <input type="email" id="compose-to" placeholder="To" class="compose-input">
                    <input type="text" id="compose-subject" placeholder="Subject" class="compose-input">
                    <textarea id="compose-body" placeholder="Message..." class="compose-body"></textarea>
                </div>
            </div>

            <!-- Message detail view -->
            <div id="message-view" class="message-view hidden">
                <div class="msg-header">
                    <button id="msg-back" class="icon-btn">←</button>
                    <div class="msg-actions">
                        <button id="msg-reply" class="icon-btn">↩</button>
                        <button id="msg-archive" class="icon-btn">📁</button>
                        <button id="msg-delete" class="icon-btn">🗑️</button>
                    </div>
                </div>
                <div id="msg-content" class="msg-content"></div>
            </div>
        </div>
    </div>

    <script type="module" src="../../nuxel-common/bridge.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/imap.js"></script>
    <script src="js/mail.js"></script>
</body>
</html>
