<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="nuxel-app-id" content="org.nuxel.Files">
    <link rel="manifest" href="manifest.json">
    <title>Nuxel Files</title>
    <link rel="stylesheet" href="css/files.css">
</head>
<body>
    <div class="top-bar">
        <button id="back-btn" class="icon-btn">←</button>
        <div class="breadcrumb" id="breadcrumb">
            <span>Files</span>
        </div>
        <button id="new-folder-btn" class="icon-btn">📁</button>
    </div>

    <div id="file-grid" class="file-grid"></div>

    <div id="upload-area" class="upload-area hidden">
        <p>Drop files to upload</p>
    </div>

    <!-- Create folder dialog -->
    <div id="folder-dialog" class="dialog-overlay hidden">
        <div class="dialog">
            <h3>New Folder</h3>
            <input type="text" id="folder-name" class="dialog-input" placeholder="Folder name">
            <div class="dialog-actions">
                <button id="dialog-cancel" class="btn-secondary">Cancel</button>
                <button id="dialog-create" class="btn-primary">Create</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../nuxel-common/bridge.js"></script>
    <script src="js/files.js"></script>
</body>
</html>
