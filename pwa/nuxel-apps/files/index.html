<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3beaa1">
<meta name="nuxel-app-id" content="org.nuxel.Files">
<link rel="manifest" href="manifest.json">
<title>Nuxel Files</title>
<link rel="stylesheet" href="../../nuxel-common/theme.css">
<link rel="stylesheet" href="css/files.css?v=p44000">
</head>
<body>
<header class="top-bar">
  <button id="back-btn" class="icon-btn" title="Parent folder">←</button>
  <button id="home-btn" class="icon-btn" title="Home folder">⌂</button>
  <div class="breadcrumb" id="breadcrumb"><span data-path="/">~</span></div>
  <button id="refresh-btn" class="icon-btn" title="Refresh">↻</button>
  <button id="select-btn" class="icon-btn" title="Select">☑</button>
</header>
<div class="path-line"><span id="cwd-abs" class="mono">home</span></div>

<div id="selection-bar" class="selection-bar hidden">
  <span id="selection-label">0 selected</span>
  <button id="sel-all">All</button>
  <button id="sel-none">None</button>
  <button id="sel-cancel">Done</button>
</div>

<div id="toolbar" class="toolbar">
  <button id="new-folder-btn">New folder</button>
  <button id="rename-btn" disabled>Rename</button>
  <button id="delete-btn" disabled>Delete</button>
  <button id="copy-btn" disabled>Copy</button>
  <button id="cut-btn" disabled>Cut</button>
  <button id="paste-btn" disabled>Paste</button>
  <button id="archive-btn" disabled>Zip</button>
  <button id="extract-btn" disabled>Extract</button>
  <button id="send-btn" disabled>Send</button>
  <button id="clipboard-info" class="ghost"></button>
</div>

<div id="file-grid" class="file-grid"></div>
<div id="status" class="status"></div>

<div id="prompt-dialog" class="dialog-overlay hidden">
  <div class="dialog">
    <h3 id="prompt-title">Folder name</h3>
    <input type="text" id="prompt-input" class="dialog-input" placeholder="Name">
    <p id="prompt-error" class="error"></p>
    <div class="dialog-actions">
      <button id="prompt-cancel" class="btn-secondary">Cancel</button>
      <button id="prompt-ok" class="btn-primary">OK</button>
    </div>
  </div>
</div>

<div id="confirm-dialog" class="dialog-overlay hidden">
  <div class="dialog">
    <h3>Confirm</h3>
    <p id="confirm-text">Delete selected items?</p>
    <div class="dialog-actions">
      <button id="confirm-cancel" class="btn-secondary">Cancel</button>
      <button id="confirm-ok" class="btn-danger">Delete</button>
    </div>
  </div>
</div>

<div id="send-dialog" class="dialog-overlay hidden">
  <div class="dialog send-dialog">
    <h3>Send files</h3>
    <p id="send-summary" class="hint">0 files selected</p>
    <div class="share-methods" role="group" aria-label="Share method">
      <button id="share-bluetooth" type="button" class="share-method selected" aria-pressed="true">Bluetooth</button>
      <button id="share-wifi" type="button" class="share-method" disabled title="Coming soon">Wi-Fi Direct · Coming soon</button>
      <button id="share-nearby" type="button" class="share-method" disabled title="Coming soon">Nearby · Coming soon</button>
    </div>
    <label class="send-device-label">Receiving device
      <select id="send-device"></select>
    </label>
    <progress id="send-progress" max="100" value="0" hidden></progress>
    <p id="send-status" class="hint">Choose a paired device.</p>
    <p id="send-error" class="error"></p>
    <div class="dialog-actions">
      <button id="send-close" class="btn-secondary">Cancel</button>
      <button id="send-ok" class="btn-primary" disabled>Send</button>
    </div>
  </div>
</div>

<script src="../../nuxel-common/theme.js"></script>
<script src="../../nuxel-common/haptics.js"></script>
<script type="module" src="../../nuxel-common/bridge.js"></script>
<script src="js/files.js?v=p44000"></script>
</body>
</html>
