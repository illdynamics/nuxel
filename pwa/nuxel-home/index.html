<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="nuxel-app-id" content="org.nuxel.Home">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Nuxel Home">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Nuxel</title>
    <link rel="stylesheet" href="../nuxel-common/theme.css?v=a81">
    <link rel="stylesheet" href="css/style.css?v=a47">
    <link rel="stylesheet" href="css/launcher.css?v=a47">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/status-bar.css?v=a54">
    <link rel="stylesheet" href="css/home-settings.css">
    <link rel="stylesheet" href="css/widgets.css?v=a81">
    <link rel="stylesheet" href="css/lockscreen.css?v=a72">
</head>
<body>
    <!-- Boot animation splash (nuxel-boot-animation.mp4) — shown while the
         home PWA boots; faded out by js/app.js once the app is ready. -->
    <div id="boot-splash" aria-hidden="true">
        <video id="boot-splash-video" src="assets/nuxel-boot-animation.mp4"
               muted autoplay playsinline loop preload="auto"></video>
    </div>

    <!-- Status Bar -->
    <!-- A54: one right-hand cluster owns signal/Wi-Fi/battery/percent.  Each
         indicator is a measured flex cell inside a single container with a fixed
         gap, so no sibling can overlap another during rotation, resizing or the
         connecting -> connected transition.  There is exactly ONE layout owner
         for the right cluster (safe-zones.js moves this cluster as a unit). -->
    <div id="status-bar" class="status-bar">
        <div class="status-left">
            <span id="status-time">00:00</span>
        </div>
        <div class="status-right">
            <span id="status-signal" class="status-icon signal-icon"></span>
            <span id="status-wifi" class="status-icon wifi-icon"></span>
            <span id="status-battery" class="status-icon battery-icon"></span>
            <span id="status-battery-pct" hidden></span>
        </div>
    </div>

    <!-- App Grid -->
    <div id="app-grid" class="app-grid">
        <div class="app-grid-header">
            <!-- Kept deliberately compact: this replaces only the Home header,
                 not the Nuxel brand elsewhere in the OS. Values are populated
                 by system-monitor.js from the loopback-only native endpoint. -->
            <section id="system-monitor" class="system-monitor" aria-label="Live system usage" aria-live="polite">
                <div class="system-meter" data-meter="cpu"><span class="system-meter-label">CPU</span><span class="system-meter-value">--</span><span class="system-meter-detail">-- MHz</span><span class="system-meter-bar" aria-hidden="true"><i></i></span></div>
                <div class="system-meter" data-meter="memory"><span class="system-meter-label">MEM</span><span class="system-meter-value">--</span><span class="system-meter-detail">-- GiB</span><span class="system-meter-bar" aria-hidden="true"><i></i></span></div>
                <div class="system-meter" data-meter="gpu"><span class="system-meter-label">GPU</span><span class="system-meter-value">--</span><span class="system-meter-detail">-- MHz</span><span class="system-meter-bar" aria-hidden="true"><i></i></span></div>
                <div class="system-meter" data-meter="gpu-memory"><span class="system-meter-label">VRAM</span><span class="system-meter-value">--</span><span class="system-meter-detail">shared RAM</span><span class="system-meter-bar" aria-hidden="true"><i></i></span></div>
            </section>
            <div class="app-grid-indicator">
                <span class="dot active"></span>
                <span class="dot"></span>
            </div>
        </div>
        <div id="app-list" class="app-list"></div>
    </div>

    <!-- Dock -->
    <div id="dock" class="dock" data-background="none">
        <div class="dock-items" id="dock-items"></div>
    </div>

    <!-- Search -->
    <div id="search-overlay" class="search-overlay hidden">
        <div class="search-bar">
            <input type="text" id="search-input" class="search-input" placeholder="Search apps..." autocomplete="off">
            <button id="search-close" class="search-close">Cancel</button>
        </div>
        <div id="search-results" class="search-results"></div>
    </div>

    <!-- Quick Settings -->
    <div id="quick-settings" class="quick-settings hidden">
        <div class="qs-row">
            <div class="qs-item" id="qs-wifi" data-enabled="false">
                <img class="qs-icon" src="/assets/nuxel-quicksettings-icon-pack/01-wifi.png?v=a44" alt="" onerror="this.hidden=true">
                <span class="qs-label">WiFi</span>
            </div>
            <div class="qs-item" id="qs-bluetooth" data-enabled="false">
                <img class="qs-icon" src="/assets/nuxel-quicksettings-icon-pack/04-bluetooth.png?v=a44" alt="" onerror="this.hidden=true">
                <span class="qs-label">BT</span>
            </div>
            <div class="qs-item" id="qs-mobile" data-enabled="false">
                <img class="qs-icon" src="/assets/nuxel-quicksettings-icon-pack/02-mobile-signal.png?v=a44" alt="" onerror="this.hidden=true">
                <span class="qs-label">Mobile</span>
            </div>
            <div class="qs-item" id="qs-location" data-enabled="false">
                <img class="qs-icon" src="/assets/nuxel-quicksettings-icon-pack/09-location.png?v=a44" alt="" onerror="this.hidden=true">
                <span class="qs-label">Location</span>
            </div>
        </div>
        <div class="qs-row">
            <div class="qs-item" id="qs-dnd" data-enabled="false">
                <img class="qs-icon" src="/assets/nuxel-quicksettings-icon-pack/11-do-not-disturb.png?v=a44" alt="" onerror="this.hidden=true">
                <span class="qs-label">DND</span>
            </div>
            <div class="qs-item" id="qs-flashlight" data-enabled="false">
                <img class="qs-icon" src="/assets/nuxel-quicksettings-icon-pack/10-flashlight.png?v=a44" alt="" onerror="this.hidden=true">
                <span class="qs-label">Flash</span>
            </div>
            <div class="qs-item" id="qs-rotate" data-enabled="false">
                <img class="qs-icon" src="/assets/nuxel-quicksettings-icon-pack/17-rotation-lock.png?v=a44" alt="" onerror="this.hidden=true">
                <span class="qs-label">Rotate</span>
            </div>
            <div class="qs-item" id="qs-settings" data-enabled="true">
                <img class="qs-icon" src="/assets/nuxel-quicksettings-icon-pack/30-quick-settings.png?v=a44" alt="" onerror="this.hidden=true">
                <span class="qs-label">Settings</span>
            </div>
        </div>
    </div>

    <!-- Recents -->
    <div id="recents-view" class="recents-view hidden">
        <div id="recents-list" class="recents-list"></div>
    </div>

    <!-- Phone Status Indicator -->
    <div id="phone-status" class="phone-status hidden">
        <span id="call-status-text" class="call-status-text"></span>
        <button id="call-status-end" class="call-status-btn">End Call</button>
    </div>

    <!-- Android-style system navigation: Back / Home / Recents.  The image
         files live at the repository asset root so the deployed static root and
         local launcher use the same artwork. -->
    <nav id="system-navigation" class="system-navigation" aria-label="System navigation">
        <button type="button" id="nav-back" data-nav="back" aria-label="Back"><img src="/assets/button-left.png?v=a44" alt=""><span class="nav-fallback" aria-hidden="true">‹</span></button>
        <button type="button" id="nav-home" data-nav="home" aria-label="Home"><img src="/assets/button-middle.png?v=a44" alt=""><span class="nav-fallback" aria-hidden="true">●</span></button>
        <button type="button" id="nav-recents" data-nav="recents" aria-label="Recent apps"><img src="/assets/button-right.png?v=a44" alt=""><span class="nav-fallback" aria-hidden="true">▢</span></button>
    </nav>

    <!-- A45 Penguin Lockscreen — full-screen swipe-to-unlock.  Uses the exact
         owner artwork /assets/nuxel-lockscreen.jpg (wallpaper) and
         /assets/nuxel-lockhead.png (draggable handle). -->
    <div id="lockscreen" class="lockscreen" aria-label="Nuxel locked">
        <div class="lockscreen-wallpaper" aria-hidden="true"></div>
        <div class="lockscreen-meta">
            <div class="lockscreen-time" id="lockscreen-time">--:--</div>
            <div class="lockscreen-date" id="lockscreen-date"></div>
            <div class="lockscreen-battery" id="lockscreen-battery">—%</div>
        </div>
        <div class="lockscreen-handle-wrap" id="lockscreen-handle-wrap">
            <!-- The outer container owns pointer capture and the drag transform.
                 The inner image carries only the decorative idle wiggle, so the
                 two transforms can never fight over the unlock gesture. -->
            <div id="lockscreen-handle" class="lockscreen-handle" role="button"
                 aria-label="Drag the penguin upward to unlock">
                <img id="lockscreen-lockhead" class="lockscreen-lockhead-motion"
                     src="/assets/nuxel-lockhead.png?v=a45" alt=""
                     draggable="false" aria-hidden="true">
            </div>
            <div class="lockscreen-hint" id="lockscreen-hint" aria-hidden="true">swipe up to unlock</div>
        </div>
        <div class="lockscreen-indicators" id="lockscreen-indicators"
             role="status" aria-label="Device status"
             data-power-source="" data-usb-source="" data-live-source="">
            <span class="lockscreen-indicator charging-ind" id="lockscreen-indicator-charging"
                  role="img" aria-label="Charging" aria-live="polite" aria-hidden="true"><span class="lockscreen-indicator-glow" aria-hidden="true"></span><img src="/assets/nuxel-charging.png?v=a77.1" alt="" draggable="false"></span>
            <span class="lockscreen-indicator usb-ind" id="lockscreen-indicator-usb"
                  role="img" aria-label="USB connected to computer" aria-live="polite" aria-hidden="true"><span class="lockscreen-indicator-glow" aria-hidden="true"></span><img src="/assets/nuxel-connected-pc.png?v=a77.1" alt="" draggable="false"></span>
            <span class="lockscreen-indicator live-ind" id="lockscreen-indicator-live"
                  role="img" aria-label="Live console active" aria-live="polite" aria-hidden="true"><span class="lockscreen-indicator-glow" aria-hidden="true"></span><img src="/assets/nuxel-live-console-active.png?v=a77.1" alt="" draggable="false"></span>
        </div>
    </div>

    <script>
    // Boot-lock gate: the lockscreen is the visible boot surface ONLY in phone
    // launch mode (?boot=os).  For any other launch mode (the UTM/desktop
    // launcher) hide it before first paint so the desktop behaviour is intact.
    (function () {
        'use strict';
        try {
            if (new URLSearchParams(window.location.search).get('boot') !== 'os') {
                var ls = document.getElementById('lockscreen');
                if (ls) ls.hidden = true;
            }
        } catch (e) { /* URLSearchParams unavailable: keep default (locked) */ }
    })();
    </script>

    <script>
    // Home is a fixed launcher, not a zoomable document.  Keep pan/swipe
    // working, but refuse every browser zoom path: pinch (two-finger touch),
    // WebKit gesture events, Ctrl/Cmd-wheel and Ctrl/Cmd +/-/0.
    (function () {
        'use strict';
        var stopPinch = function (event) {
            if (event.touches && event.touches.length > 1) event.preventDefault();
        };
        document.addEventListener('touchstart', stopPinch, {passive:false});
        document.addEventListener('touchmove', stopPinch, {passive:false});
        ['gesturestart','gesturechange','gestureend'].forEach(function (type) {
            document.addEventListener(type, function (event) { event.preventDefault(); }, {passive:false});
        });
        document.addEventListener('wheel', function (event) {
            if (event.ctrlKey || event.metaKey) event.preventDefault();
        }, {passive:false});
        document.addEventListener('keydown', function (event) {
            if ((event.ctrlKey || event.metaKey) && ['+','=','-','0'].indexOf(event.key) >= 0) {
                event.preventDefault();
            }
        });
        document.addEventListener('dblclick', function (event) { event.preventDefault(); }, {passive:false});
    })();
    </script>
    <script src="../nuxel-common/theme.js?v=a81"></script>
    <script src="../nuxel-common/haptics.js?v=a81"></script>
    <script src="js/apps.js?v=a80"></script>
    <script src="js/layout-model.js"></script>
    <script src="js/launcher.js?v=a81"></script>
    <script src="js/status-bar.js?v=a81"></script>
    <script src="js/search.js"></script>
    <script type="module" src="../nuxel-common/bridge.js"></script>
    <script src="js/bridge.js?v=a63"></script>
    <script src="js/recents.js"></script>
    <script src="js/qs.js?v=a73"></script>
    <!-- A32: host backend (settings/buttons/terminal) + status-bar safe zones.
         Both are inert without a host, so the VM/desktop launcher is unchanged. -->
    <script src="js/host-bridge.js"></script>
    <!-- A33: the durable settings document store (verbose boot, handoff config)
         and the verbose-boot log overlay.  Both are inert without a host. -->
    <script src="js/settings-store.js"></script>
    <script src="js/safe-zones.js"></script>
    <script src="js/osd.js?v=a47"></script>
    <script src="js/bootlog.js"></script>
    <script src="js/touch-keyboard.js?v=a81"></script>
    <script src="js/lockscreen-indicators.js?v=a77.1"></script>
    <script src="js/lockscreen.js?v=a77.1"></script>
    <script src="js/navigation.js?v=a47"></script>
    <script src="js/gestures.js"></script>
    <script src="js/widgets.js?v=a81"></script>
    <script src="js/home-settings.js?v=a81"></script>
    <script src="js/system-monitor.js?v=a47"></script>
    <script src="js/scroll-indicators.js"></script>
    <!-- A44: one-shot in-engine icon/WebKit/cache health report to nuxelDiag. -->
    <script src="js/app.js?v=a81"></script>
</body>
</html>
