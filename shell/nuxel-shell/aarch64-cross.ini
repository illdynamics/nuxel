# Meson cross-compilation file for building the native Nuxel GTK4 C apps and
# sandbox for aarch64 (Google Tensor G5 / Exynos 5500, mustang) and the ARM64
# UTM VM.
#
# Prerequisites on the build host (macOS Apple Silicon or x86_64 Linux):
#   - aarch64-linux-gnu-gcc        (cross C compiler)
#   - aarch64-linux-gnu-pkg-config (cross pkg-config)
#   - aarch64 Linux sysroot with GTK4, libadwaita-1, glib-2.0, gio-2.0,
#     and optionally json-glib, ModemManager, libcap dev packages.
#
# Point SYSROOT below at the installed aarch64 rootfs that carries those dev
# packages. When SYSROOT is a bare sysroot (no ModemManager / json-glib /
# libcap), the optional deps degrade gracefully (meson required: false).

[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = 'aarch64-linux-gnu-pkg-config'
pkg-config = 'aarch64-linux-gnu-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
# C compiler default flags for aarch64 Linux.
c_args = []
c_link_args = ['-static-libgcc']

[built-in options]
# Fail soft on missing optional deps so cross-builds still complete.
c_std = 'c11'
