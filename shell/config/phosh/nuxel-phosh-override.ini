;==============================================================================
; Nuxel Phosh Shell Override Configuration
; Google Pixel 10 Pro XL (mustang)
;
; This file overrides Phosh's default settings to optimize for the mustang
; form factor, display, and Nuxel's PWA-first application model.
;
; Installation: /etc/phosh/nuxel-phosh-override.ini
; Phosh >= 0.42 reads per-device override files from /etc/phosh/
;==============================================================================

[device:mustang]
; ── Display ─────────────────────────────────────────────────────────────────
; Samsung AMB655X LTPO OLED, 3120x1440@120Hz native
display_scale=2.5                          ; UI scale for 3120px width at ~512 DPI
display_width=3120
display_height=1440
display_refresh_rate=120                   ; Mustang supports LTPO 1-120Hz
display_force_orientation=portrait         ; Lock to portrait (phone form factor)
display_never_suspend=false                ; Allow suspend when idle
boot_animation=/usr/share/nuxel/boot/nuxel-boot-animation.mp4
boot_animation_enabled=true
boot_background=#0a1628                       ; Nuxel navy fallback during boot
display_suspend_timeout=30                 ; Seconds before DPMS suspend
display_dim_timeout=15                     ; Seconds before dimming
display_brightness_steps=32                ; Fine-grained brightness control

; ── Launcher ────────────────────────────────────────────────────────────────
; Set nuxel-home PWA as the default launcher app
; This replaces the default Phosh app grid with Nuxel's PWA-based home screen
launcher_app=org.nuxel.Home               ; Flatpak ID for nuxel-home PWA
launcher_app_path=/usr/share/nuxel/pwas/nuxel-home/index.html  ; Fallback path
launcher_app_type=flatpak                  ; Can be "flatpak", "web", or "native"
launcher_show_search=true                  ; Show search bar in launcher
launcher_search_provider=nuxel             ; Use nuxel-bridge for search results
launcher_favorites=                        ; Default favorites (comma separated);
    org.nuxel.Dialer,
    org.nuxel.Messages,
    org.nuxel.Mail,
    org.nuxel.Calendar,
    org.nuxel.Files

; ── Gesture Navigation ──────────────────────────────────────────────────────
; Mustang uses gesture navigation (no on-screen nav buttons)
gesture_navigation=true                    ; Enable gesture nav (swipe from edges)
gesture_back_edge_width=20                 ; Pixels from edge to detect back gesture
gesture_back_edge_sensitivity=0.5          ; Sensitivity for back gesture detection
gesture_home_edge_height=8                 ; Pixels from bottom for home gesture
gesture_home_swipe_up_threshold=80         ; Pixels before home gesture activates
gesture_swipe_to_switch=true               ; Swipe bottom edge to switch apps
gesture_three_finger_swipe=false           ; Disable 3-finger (not useful on phone)
gesture_edge_reject_width=40               ; Width for edge rejection zones

; ── Lock Screen ─────────────────────────────────────────────────────────────
lockscreen_enabled=true
lockscreen_timeout=5                       ; Seconds before lock
lockscreen_show_notifications=true         ; Show notifications on lock screen
lockscreen_hide_notification_content=false ; Show notification content
lockscreen_wallpaper=/usr/share/backgrounds/nuxel/lockscreen.png
lockscreen_wallpaper_blur=true             ; Blur wallpaper on lock screen
lockscreen_wallpaper_style=fill            ; Fill the screen with wallpaper
lockscreen_media_controls=true             ; Show media playback controls
lockscreen_quick_camera=true               ; Double-tap power for camera

; ── Status Bar ──────────────────────────────────────────────────────────────
; Mustang has a notch/punch-hole camera, so status bar layout is critical
status_bar_position=top
status_bar_height=36                       ; Pixels (thinner for more screen space)
status_bar_show_time=true
status_bar_show_battery=true
status_bar_show_wifi=true
status_bar_show_mobile=true                ; Show cellular signal strength
status_bar_show_bluetooth=true
status_bar_show_alarm=true
status_bar_show_volume=true                ; Show when media is playing
status_bar_notch_inset=true                ; Account for punch-hole camera
status_bar_notch_position=center           ; Center punch-hole on mustang
status_bar_notch_width=32                  ; Approximate punch-hole width in px

; ── Quick Settings ──────────────────────────────────────────────────────────
; Mobile-first quick settings layout
quick_settings_tiles_per_row=4             ; More tiles on 3120px display
quick_settings_max_rows=3                  ; Before scroll
quick_settings_show_media_player=true
quick_settings_show_brightness_slider=true
quick_settings_brightness_auto=true
quick_settings_show_wifi_toggle=true
quick_settings_show_bluetooth_toggle=true
quick_settings_show_mobile_data_toggle=true
quick_settings_show_flashlight_toggle=true
quick_settings_show_dnd_toggle=true
quick_settings_show_rotation_toggle=true
quick_settings_show_hotspot_toggle=true
quick_settings_show_nfc_toggle=true        ; Mustang has NXP SN220 NFC

; ── Notifications ───────────────────────────────────────────────────────────
; Use nuxel-notifications bridge for PWA notification handling
notifications_use_fdo=true                 ; Use org.freedesktop.Notifications
notifications_bridge=org.nuxel.Notifications
notifications_show_banners=true
notifications_banner_timeout=4             ; Seconds banner stays visible
notifications_group_by_app=true
notifications_show_clear_all=true
notifications_show_dnd_button=true
notifications_show_history=true
notifications_history_max=100

; ── Phone / Telephony ───────────────────────────────────────────────────────
; Mustang uses Exynos 5500 modem via ModemManager
phone_enabled=true
phone_dialer_app=org.nuxel.Dialer         ; Native dialer PWA
phone_sms_app=org.nuxel.Messages          ; Native messaging PWA
phone_contacts_app=org.nuxel.Contacts     ; Native contacts app
phone_use_modemmanager=true               ; Use ModemManager D-Bus API
phone_ims_enabled=false                   ; IMS/VoLTE (work in progress)

; ── Keyboard ────────────────────────────────────────────────────────────────
keyboard_default_layout=us
keyboard_auto_show=true                    ; Show keyboard on text input focus
keyboard_height=300                        ; Default keyboard height in pixels
keyboard_vibrate_on_press=true             ; Haptic feedback on keypress
keyboard_swipe_typing=true                 ; Swipe-to-type
keyboard_emoji_panel=true                  ; Emoji picker
keyboard_clipboard_toolbar=true            ; Cut/copy/paste bar above keyboard

; ── Power Management ────────────────────────────────────────────────────────
power_button_action=suspend                ; Short press: suspend
power_button_long_action=power_menu        ; Long press: power menu
power_menu_show_restart=true
power_menu_show_screenshot=true
power_menu_show_flashlight=true
power_menu_show_airplane_mode=true
power_menu_show_recovery=true              ; Boot to recovery option
volume_up_button_action=volume_up
volume_down_button_action=volume_down
volume_button_long_action=screenshot       ; Both volume buttons: screenshot

; ── Disabled Desktop Components ─────────────────────────────────────────────
; On a mobile phone, many desktop-oriented Phosh components are unnecessary
; and waste resources. Disable them here.
disable_app_grid=true                      ; Replaced by PWA launcher
disable_workspace_switcher=true            ; No virtual desktops on phone
disable_window_previews=true               ; Redundant with gesture switcher
disable_titlebar_buttons=true              ; Mobile apps handle their own chrome
disable_desktop_notifications=false        ; Keep notification center
disable_activity_overview=true             ; No desktop overview mode
disable_favorites_bar=false                ; Keep the favorites dock
disable_screencast_controls=true           ; Not needed on phone
disable_remote_desktop=true                ; No VNC/RDP on phone
disable_auto_rotate=false                  ; Allow auto-rotation

; ── Wallpaper ───────────────────────────────────────────────────────────────
; Default Nuxel wallpaper for mustang
wallpaper=/usr/share/nuxel/wallpapers/nuxel-background.png
wallpaper_dimensions=3120x1440             ; Match display resolution
wallpaper_style=fill                       ; Fill the screen
wallpaper_dark_mode=true                   ; Default to dark theme

; ── Session ─────────────────────────────────────────────────────────────────
; Wayland session configuration for mustang
session_type=wayland
compositor=phoc                            ; Phosh's built-in compositor
default_wm=phosh                           ; Phosh is the window manager
scale_monitor_framebuffer=true             ; Scale the entire framebuffer
cursor_size=24                             ; Slightly larger cursor for touch
cursor_theme=Adwaita
font_scale=1.2                             ; Slightly larger fonts for readability
touch_experience=pointer                   ; Touch input mode

; ── Debug ───────────────────────────────────────────────────────────────────
; Only enable when troubleshooting
debug_log_level=warning                     ; Log level: error, warning, info, debug
debug_log_target=journal                    ; Log to systemd journal
debug_show_fps=false                        ; Don't show FPS in production
